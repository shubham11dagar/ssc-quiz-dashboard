    // Theme Toggle Initialization
    const themeToggleBtn = document.getElementById('theme-toggle');
    const sunIcon = document.getElementById('sun-icon');
    const moonIcon = document.getElementById('moon-icon');

    function initTheme() {
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      } else {
        document.documentElement.classList.remove('dark');
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      }
    }

    themeToggleBtn.addEventListener('click', () => {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      }
    });

    // Initialize Quiz
    function initQuiz() {
      totalNumEl.textContent = quizData.length;
      loadQuestion();
    }

      currentNumEl.textContent = currentIndex + 1;
      liveScoreEl.textContent = score;
      qBadge.textContent = `Q${q.id}`;
      progressBar.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;

      // Update Question Prompt
      questionTextEl.textContent = q.question;

      // Reset Options
      optionsContainer.innerHTML = '';
      explanationBox.classList.add('hidden');
      nextBtn.disabled = true;

      const labels = ['A', 'B', 'C', 'D'];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = `w-full text-left p-2.5 sm:p-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/80 hover:bg-blue-50 dark:hover:bg-slate-700 hover:border-blue-300 transition-all text-xs sm:text-sm flex items-start space-x-2.5 font-medium cursor-pointer option-btn`;
        btn.onclick = () => selectOption(idx);

        btn.innerHTML = `
          <span class="w-5 h-5 rounded-md bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5 option-badge">${labels[idx]}</span>
          <span class="flex-1 leading-snug">${opt}</span>
        `;
        optionsContainer.appendChild(btn);
      });

      // If already answered (navigating back/forward state)
      if (userAnswers[currentIndex] !== null) {
        selectOption(userAnswers[currentIndex], false);
      }
    }

    // Handle Option Selection
    function selectOption(index, isFirstTime = true) {
      const q = quizData[currentIndex];
      const buttons = optionsContainer.querySelectorAll('button');

      if (isFirstTime && userAnswers[currentIndex] === null) {
        userAnswers[currentIndex] = index;
        if (index === q.correct) {
          score++;
          liveScoreEl.textContent = score;
        }
      }

      const selectedIdx = userAnswers[currentIndex];
      const isCorrect = selectedIdx === q.correct;

      // Disable all buttons
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        btn.classList.remove('hover:bg-blue-50', 'dark:hover:bg-slate-700', 'hover:border-blue-300', 'cursor-pointer');
        btn.classList.add('cursor-default');

        const badge = btn.querySelector('.option-badge');

        if (idx === q.correct) {
          btn.classList.remove('bg-slate-50', 'dark:bg-slate-800/80', 'border-slate-200', 'dark:border-slate-700');
          btn.classList.add('bg-emerald-100', 'dark:bg-emerald-950/60', 'border-emerald-500', 'text-emerald-900', 'dark:text-emerald-200');
          badge.classList.remove('bg-slate-200', 'dark:bg-slate-700');
          badge.classList.add('bg-emerald-600', 'text-white');
        } else if (idx === selectedIdx && !isCorrect) {
          btn.classList.remove('bg-slate-50', 'dark:bg-slate-800/80', 'border-slate-200', 'dark:border-slate-700');
          btn.classList.add('bg-rose-100', 'dark:bg-rose-950/60', 'border-rose-500', 'text-rose-900', 'dark:text-rose-200');
          badge.classList.remove('bg-slate-200', 'dark:bg-slate-700');
          badge.classList.add('bg-rose-600', 'text-white');
        } else {
          btn.classList.add('opacity-50');
        }
      });

      // Show Explanation Box
      explanationBox.classList.remove('hidden');
      if (isCorrect) {
        explanationBox.className = "mt-3 p-3 rounded-lg border text-xs sm:text-sm leading-relaxed transition-all duration-200 bg-emerald-50 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-800/50 text-emerald-900 dark:text-emerald-200";
        feedbackIcon.innerHTML = `<svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
        feedbackTitle.textContent = "Correct Answer!";
      } else {
        explanationBox.className = "mt-3 p-3 rounded-lg border text-xs sm:text-sm leading-relaxed transition-all duration-200 bg-rose-50 dark:bg-rose-950/40 border-rose-200 dark:border-rose-800/50 text-rose-900 dark:text-rose-200";
        feedbackIcon.innerHTML = `<svg class="w-4 h-4 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
        feedbackTitle.textContent = `Incorrect! Correct: (${['A','B','C','D'][q.correct]}) ${q.options[q.correct]}`;
      }
      explanationText.textContent = q.explanation;

      // Enable Next Button
      nextBtn.disabled = false;
    }

    // Next Question Handler
    function nextQuestion() {
      if (currentIndex < quizData.length - 1) {
        currentIndex++;
        loadQuestion();
      } else {
        showResults();
      }
    }

    // Show End Results
    function showResults() {
      quizContainer.classList.add('hidden');
      resultsContainer.classList.remove('hidden');

      const pct = Math.round((score / quizData.length) * 100);
      document.getElementById('summary-score').textContent = `${score}/${quizData.length}`;
      document.getElementById('summary-accuracy').textContent = `${pct}%`;
      document.getElementById('summary-incorrect').textContent = `${quizData.length - score}`;

      renderReviewList();
    }

    // Render Review Breakdown
    function renderReviewList() {
      const reviewListEl = document.getElementById('review-list');
      reviewListEl.innerHTML = '';

      quizData.forEach((q, idx) => {
        const userAns = userAnswers[idx];
        const isCorrect = userAns === q.correct;

        if (reviewFilter === 'incorrect' && isCorrect) return;

        const card = document.createElement('div');
        card.className = `p-3 rounded-lg border text-xs sm:text-sm ${
          isCorrect
            ? 'bg-slate-50 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700'
            : 'bg-rose-50/50 dark:bg-rose-950/20 border-rose-200 dark:border-rose-900/50'
        }`;

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2 mb-1">
            <span class="font-bold text-slate-800 dark:text-slate-200">Q${q.id}. ${q.question}</span>
            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${
              isCorrect
                ? 'bg-emerald-100 dark:bg-emerald-900/60 text-emerald-800 dark:text-emerald-300'
                : 'bg-rose-100 dark:bg-rose-900/60 text-rose-800 dark:text-rose-300'
            }">${isCorrect ? 'Correct' : 'Incorrect'}</span>
          </div>
          <div class="space-y-1 mt-1 text-slate-600 dark:text-slate-400">
            <div><span class="font-semibold text-slate-700 dark:text-slate-300">Your Answer:</span> ${userAns !== null ? q.options[userAns] : 'Not Answered'}</div>
            ${!isCorrect ? `<div><span class="font-semibold text-emerald-600 dark:text-emerald-400">Correct Answer:</span> ${q.options[q.correct]}</div>` : ''}
            <div class="mt-1 pt-1 border-t border-slate-200 dark:border-slate-700/60 text-slate-500 dark:text-slate-400 text-[11px]"><span class="font-semibold">Explanation:</span> ${q.explanation}</div>
          </div>
        `;

        reviewListEl.appendChild(card);
      });

      if (reviewListEl.children.length === 0) {
        reviewListEl.innerHTML = `
          <div class="text-center py-8 text-slate-500 dark:text-slate-400 text-sm">
            🎉 Great job! No incorrect questions to display.
          </div>
        `;
      }
    }

    function setReviewFilter(filter) {
      reviewFilter = filter;
      document.getElementById('filter-all').className = filter === 'all' ? 'px-2.5 py-1 rounded bg-blue-600 text-white font-medium' : 'px-2.5 py-1 rounded bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 font-medium';
      document.getElementById('filter-incorrect').className = filter === 'incorrect' ? 'px-2.5 py-1 rounded bg-blue-600 text-white font-medium' : 'px-2.5 py-1 rounded bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 font-medium';
      renderReviewList();
    }

    // Restart Quiz
    function restartQuiz() {
      currentIndex = 0;
      score = 0;
      userAnswers = new Array(quizData.length).fill(null);
      resultsContainer.classList.add('hidden');
      quizContainer.classList.remove('hidden');
      initQuiz();
    }

    // Initialize application on load
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      initQuiz();
    });
  </script>
</body>
</html>
