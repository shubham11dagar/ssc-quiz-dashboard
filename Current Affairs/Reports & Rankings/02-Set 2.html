<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSC Exam Prep 2026: Indices, Reports & Demographics Quiz</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-light: rgba(59, 130, 246, 0.15);
      --correct: #10b981;
      --correct-bg: rgba(16, 185, 129, 0.15);
      --correct-border: #059669;
      --incorrect: #ef4444;
      --incorrect-bg: rgba(239, 68, 68, 0.15);
      --incorrect-border: #dc2626;
      --border: #334155;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      --badge-bg: #334155;
      --badge-text: #38bdf8;
      --radius: 12px;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    [data-theme="light"] {
      --bg-main: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-hover: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-light: rgba(37, 99, 235, 0.1);
      --correct: #059669;
      --correct-bg: rgba(16, 185, 129, 0.12);
      --correct-border: #10b981;
      --incorrect: #dc2626;
      --incorrect-bg: rgba(239, 68, 68, 0.12);
      --incorrect-border: #ef4444;
      --border: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      --badge-bg: #e0f2fe;
      --badge-text: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* HEADER */
    header {
      height: 56px;
      padding: 0 1.25rem;
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-main);
    }

    .brand-icon {
      background: var(--accent);
      color: #ffffff;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 800;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .theme-toggle {
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
    }

    /* MAIN CONTAINER - FIT TO VIEWPORT */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0.75rem 1rem;
      overflow: hidden;
      position: relative;
    }

    .quiz-card {
      width: 100%;
      max-width: 820px;
      height: 100%;
      max-height: calc(100vh - 80px);
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      padding: 1.25rem;
      overflow: hidden;
      position: relative;
      transition: border-color 0.3s ease;
    }

    /* PROGRESS & TRACKER */
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background-color: var(--bg-main);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 0.8rem;
      flex-shrink: 0;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #6366f1);
      width: 0%;
      transition: width 0.3s ease;
    }

    .quiz-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      flex-shrink: 0;
    }

    .q-badge {
      background-color: var(--badge-bg);
      color: var(--badge-text);
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .score-tracker {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .score-value {
      color: var(--accent);
    }

    /* QUESTION SECTION */
    .question-section {
      margin-bottom: 0.8rem;
      flex-shrink: 0;
    }

    .question-text {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text-main);
    }

    /* CALLOUT BOX FOR COMPLEX QUESTIONS */
    .statement-box {
      background-color: var(--accent-light);
      border-left: 4px solid var(--accent);
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      font-family: monospace, sans-serif;
      line-height: 1.35;
    }

    .match-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }

    .match-table th, .match-table td {
      border: 1px solid var(--border);
      padding: 0.4rem 0.6rem;
      text-align: left;
    }

    .match-table th {
      background-color: var(--bg-main);
      color: var(--accent);
    }

    /* OPTIONS GRID */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin-bottom: 0.8rem;
      flex: 1;
      justify-content: center;
      overflow-y: auto;
      padding-right: 2px;
    }

    .option-btn {
      width: 100%;
      background-color: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      color: var(--text-main);
      font-size: 0.92rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: all 0.15s ease;
      line-height: 1.3;
      user-select: none;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--bg-card-hover);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .option-key {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background-color: var(--bg-main);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .option-btn:hover:not(:disabled) .option-key {
      border-color: var(--accent);
      color: var(--accent);
    }

    .option-text {
      flex: 1;
    }

    /* SELECTED STATES */
    .option-btn.correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: var(--text-main) !important;
    }

    .option-btn.correct .option-key {
      background-color: var(--correct);
      color: #ffffff !important;
      border-color: var(--correct);
    }

    .option-btn.incorrect {
      background-color: var(--incorrect-bg) !important;
      border-color: var(--incorrect-border) !important;
      color: var(--text-main) !important;
    }

    .option-btn.incorrect .option-key {
      background-color: var(--incorrect);
      color: #ffffff !important;
      border-color: var(--incorrect);
    }

    .option-btn:disabled {
      cursor: default;
      opacity: 0.85;
    }

    /* EXPLANATION / FEEDBACK BOX */
    .explanation-box {
      background-color: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      margin-bottom: 0.8rem;
      display: none;
      animation: fadeIn 0.25s ease-in-out;
      flex-shrink: 0;
    }

    .explanation-box.active {
      display: block;
    }

    .explanation-header {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .explanation-header.correct-text { color: var(--correct); }
    .explanation-header.incorrect-text { color: var(--incorrect); }

    .explanation-body {
      font-size: 0.85rem;
      line-height: 1.4;
      color: var(--text-muted);
    }

    /* FOOTER & BUTTON */
    .card-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: auto;
      padding-top: 0.4rem;
      flex-shrink: 0;
      border-top: 1px solid var(--border);
    }

    .next-btn {
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.4rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .next-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .next-btn:disabled {
      background-color: var(--border);
      color: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* END SCREEN / SUMMARY */
    .results-screen {
      display: none;
      width: 100%;
      max-width: 820px;
      height: 100%;
      max-height: calc(100vh - 80px);
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.25rem;
      flex-direction: column;
      overflow: hidden;
    }

    .results-screen.active {
      display: flex;
    }

    .results-header {
      text-align: center;
      margin-bottom: 1rem;
      flex-shrink: 0;
    }

    .results-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .results-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .score-summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-shrink: 0;
    }

    .metric-card {
      background-color: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      text-align: center;
    }

    .metric-value {
      font-size: 1.3rem;
      font-weight: 800;
    }

    .metric-value.score { color: var(--accent); }
    .metric-value.correct { color: var(--correct); }
    .metric-value.incorrect { color: var(--incorrect); }

    .metric-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 0.2rem;
      font-weight: 600;
    }

    .breakdown-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .breakdown-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding-right: 0.4rem;
      margin-bottom: 1rem;
    }

    .review-item {
      background-color: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 0.9rem;
      font-size: 0.85rem;
    }

    .review-item.is-incorrect {
      border-left: 4px solid var(--incorrect);
    }

    .review-item.is-correct {
      border-left: 4px solid var(--correct);
    }

    .review-q-number {
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.25rem;
    }

    .review-q-text {
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.4rem;
      line-height: 1.35;
    }

    .review-ans-row {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      margin-bottom: 0.4rem;
      font-size: 0.82rem;
    }

    .user-ans {
      color: var(--incorrect);
    }

    .correct-ans {
      color: var(--correct);
      font-weight: 600;
    }

    .review-exp {
      font-size: 0.8rem;
      color: var(--text-muted);
      background-color: var(--bg-card);
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      line-height: 1.35;
    }

    .restart-btn {
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 0.7rem 1.8rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .restart-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    /* KEYBOARD SHORTCUT BADGE */
    .shortcut-hint {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-left: 0.5rem;
      opacity: 0.8;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* CUSTOM SCROLLBAR FOR COMPACT DESIGN */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-main);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    @media (max-height: 650px) {
      .quiz-card, .results-screen {
        padding: 0.85rem;
      }
      .question-text {
        font-size: 0.95rem;
      }
      .option-btn {
        padding: 0.5rem 0.75rem;
        font-size: 0.85rem;
      }
      .explanation-box {
        padding: 0.5rem 0.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand">
      <div class="brand-icon">SSC</div>
      <span>Exam Prep 2026</span>
    </div>
    <div class="header-controls">
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span>
        <span id="themeLabel">Dark Mode</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main>
    <!-- ACTIVE QUIZ CARD -->
    <div class="quiz-card" id="quizCard">
      <!-- PROGRESS BAR -->
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>

      <!-- META INFO -->
      <div class="quiz-meta">
        <span class="q-badge" id="categoryBadge">General Awareness</span>
        <div class="score-tracker">
          Question <span id="currentQNum">1</span> of <span id="totalQNum">20</span>
          &nbsp;|&nbsp;
          Score: <span class="score-value" id="liveScore">0</span>
        </div>
      </div>

      <!-- QUESTION TEXT -->
      <div class="question-section">
        <div class="question-text" id="questionText">Loading question...</div>
        <div id="complexFormattingContainer"></div>
      </div>

      <!-- OPTIONS CONTAINER -->
      <div class="options-grid" id="optionsGrid">
        <!-- Rendered via JS -->
      </div>

      <!-- EXPLANATION / FEEDBACK BOX -->
      <div class="explanation-box" id="explanationBox">
        <div class="explanation-header" id="explanationHeader">
          <span>Explanation</span>
        </div>
        <div class="explanation-body" id="explanationBody"></div>
      </div>

      <!-- FOOTER -->
      <div class="card-footer">
        <button class="next-btn" id="nextBtn" onclick="handleNextQuestion()" disabled>
          <span>Next Question</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </div>
    </div>

    <!-- END RESULTS SCREEN -->
    <div class="results-screen" id="resultsScreen">
      <div class="results-header">
        <h2 class="results-title">Quiz Completed! 🎉</h2>
        <p class="results-subtitle">Here is your performance summary for SSC Exam Prep 2026</p>
      </div>

      <div class="score-summary-grid">
        <div class="metric-card">
          <div class="metric-value score" id="finalPercentage">0%</div>
          <div class="metric-label">Percentage</div>
        </div>
        <div class="metric-card">
          <div class="metric-value correct" id="finalCorrect">0</div>
          <div class="metric-label">Correct</div>
        </div>
        <div class="metric-card">
          <div class="metric-value incorrect" id="finalIncorrect">0</div>
          <div class="metric-label">Incorrect</div>
        </div>
      </div>

      <div class="breakdown-title">
        <span>Detailed Question Review</span>
        <span class="shortcut-hint" id="filterHint">Showing all responses</span>
      </div>

      <div class="breakdown-list" id="breakdownList">
        <!-- Rendered via JS -->
      </div>

      <button class="restart-btn" onclick="restartQuiz()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        <span>Restart Quiz</span>
      </button>
    </div>
  </main>

  <script>
    // QUESTION BANK DATA
    const quizData = [
      {
        id: 1,
        category: "Fiscal Health",
        question: "Which organization released the second edition of the \"Fiscal Health Index 2026\" based on official CAG data?",
        options: [
          "Reserve Bank of India (RBI)",
          "Ministry of Finance",
          "NITI Aayog",
          "16th Finance Commission"
        ],
        correctIndex: 2,
        explanation: "NITI Aayog released the second edition of the “Fiscal Health Index” evaluating states based on five core pillars using official CAG data."
      },
      {
        id: 2,
        category: "Fiscal Health",
        question: "According to the Fiscal Health Index 2026 (FY 2023–24), which state secured the Rank 1 among the 18 Major States category?",
        options: [
          "Goa",
          "Odisha",
          "Jharkhand",
          "Gujarat"
        ],
        correctIndex: 1,
        explanation: "Odisha ranked first among the 18 major states with a score of 73.1, followed by Goa (54.7) and Jharkhand (50.5)."
      },
      {
        id: 3,
        category: "Fiscal Health",
        question: "Which state ranked first in the North-Eastern and Himalayan States category of the Fiscal Health Index 2026?",
        options: [
          "Uttarakhand",
          "Tripura",
          "Assam",
          "Arunachal Pradesh"
        ],
        correctIndex: 3,
        explanation: "Arunachal Pradesh ranked first among NE/Himalayan states with an FHI score of 59.5, followed by Uttarakhand (52.5)."
      },
      {
        id: 4,
        category: "NFHS-6",
        question: "Which institution acted as the nodal agency for conducting the National Family Health Survey – 6 (NFHS-6)?",
        options: [
          "National Sample Survey Office (NSSO), New Delhi",
          "International Institute for Population Sciences (IIPS), Mumbai",
          "Indian Council of Medical Research (ICMR), New Delhi",
          "NITI Aayog, New Delhi"
        ],
        correctIndex: 1,
        explanation: "NFHS-6 was conducted by the Ministry of Health and Family Welfare with IIPS Mumbai serving as the nodal agency."
      },
      {
        id: 5,
        category: "NFHS-6",
        question: "According to NFHS-6 findings, what is India’s current Total Fertility Rate (TFR)?",
        options: [
          "2.2",
          "2.1",
          "2.0",
          "1.8"
        ],
        correctIndex: 2,
        explanation: "India’s Total Fertility Rate (TFR) remains stable at 2.0, sustaining the replacement-level fertility status."
      },
      {
        id: 6,
        category: "NFHS-6",
        question: "As per NFHS-6, what proportion of total births in India are now institutional deliveries?",
        options: [
          "85.3%",
          "87.1%",
          "90.6%",
          "95.9%"
        ],
        correctIndex: 2,
        explanation: "Institutional deliveries in India increased to 90.6%, nearing universal coverage."
      },
      {
        id: 7,
        category: "NFHS-6",
        question: "According to NFHS-6 data on child nutrition, the prevalence of stunting among children under five years declined to which percentage?",
        options: [
          "29.3%",
          "35.5%",
          "31.8%",
          "5.2%"
        ],
        correctIndex: 0,
        explanation: "Stunting prevalence among children under five years declined significantly from 35.5% to 29.3%."
      },
      {
        id: 8,
        category: "LEADS 2025",
        question: "In the 7th edition of the ‘Logistics Ease Across Different States’ (LEADS) 2025 Report released by DPIIT, which state achieved the \"Exemplar\" category among Landlocked States?",
        options: [
          "Tamil Nadu",
          "Haryana",
          "Uttar Pradesh",
          "Rajasthan"
        ],
        correctIndex: 2,
        explanation: "In LEADS 2025, Uttar Pradesh was classified as an Exemplar in the Landlocked States category (Tamil Nadu led Coastal, Mizoram led NE States, and Delhi led UTs)."
      },
      {

    // APP STATE
    let currentIndex = 0;
    let score = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let optionKeys = ['A', 'B', 'C', 'D'];

    // DOM ELEMENTS
    const quizCard = document.getElementById('quizCard');
    const resultsScreen = document.getElementById('resultsScreen');
    const progressBar = document.getElementById('progressBar');
    const categoryBadge = document.getElementById('categoryBadge');
    const currentQNum = document.getElementById('currentQNum');
    const totalQNum = document.getElementById('totalQNum');
    const liveScore = document.getElementById('liveScore');
    const questionText = document.getElementById('questionText');
    const complexFormattingContainer = document.getElementById('complexFormattingContainer');
    const optionsGrid = document.getElementById('optionsGrid');
    const explanationBox = document.getElementById('explanationBox');
    const explanationHeader = document.getElementById('explanationHeader');
    const explanationBody = document.getElementById('explanationBody');
    const nextBtn = document.getElementById('nextBtn');

    // INITIALIZATION
    function initQuiz() {
      totalQNum.textContent = quizData.length;
      renderQuestion();
    }

    // THEME TOGGLE
    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      
      document.getElementById('themeIcon').textContent = newTheme === 'dark' ? '🌙' : '☀️';
      document.getElementById('themeLabel').textContent = newTheme === 'dark' ? 'Dark Mode' : 'Light Mode';
    }

    // RENDER QUESTION
    function renderQuestion() {
      const currentQ = quizData[currentIndex];

      // Update Header/Meta
      categoryBadge.textContent = currentQ.category;
      currentQNum.textContent = currentIndex + 1;
      liveScore.textContent = score;
      
      // Update Progress Bar
      const progressPercent = ((currentIndex) / quizData.length) * 100;
      progressBar.style.width = `${progressPercent}%`;

      // Question Text
      questionText.textContent = currentQ.question;
      complexFormattingContainer.innerHTML = ''; // Placeholder for complex items if needed

      // Options
      optionsGrid.innerHTML = '';
      explanationBox.classList.remove('active');
      nextBtn.disabled = userAnswers[currentIndex] === null;

      currentQ.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `
          <div class="option-key">${optionKeys[idx]}</div>
          <div class="option-text">${opt}</div>
        `;

        // If answered previously
        if (userAnswers[currentIndex] !== null) {
          btn.disabled = true;
          if (idx === currentQ.correctIndex) {
            btn.classList.add('correct');
          } else if (idx === userAnswers[currentIndex]) {
            btn.classList.add('incorrect');
          }
        } else {
          btn.onclick = () => selectOption(idx);
        }

        optionsGrid.appendChild(btn);
      });

      // Show explanation if already answered
      if (userAnswers[currentIndex] !== null) {
        showExplanation(userAnswers[currentIndex] === currentQ.correctIndex);
      }
    }

    // SELECT OPTION
    function selectOption(selectedIndex) {
      const currentQ = quizData[currentIndex];
      userAnswers[currentIndex] = selectedIndex;

      const isCorrect = selectedIndex === currentQ.correctIndex;
      if (isCorrect) {
        score++;
        liveScore.textContent = score;
      }

      // Highlight options
      const optionBtns = optionsGrid.querySelectorAll('.option-btn');
      optionBtns.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === currentQ.correctIndex) {
          btn.classList.add('correct');
        } else if (idx === selectedIndex) {
          btn.classList.add('incorrect');
        }
      });

      // Enable Next Button
      nextBtn.disabled = false;

      // Show Feedback/Explanation
      showExplanation(isCorrect);
    }

    // SHOW EXPLANATION
    function showExplanation(isCorrect) {
      const currentQ = quizData[currentIndex];
      explanationBox.classList.add('active');
      
      if (isCorrect) {
        explanationHeader.className = 'explanation-header correct-text';
        explanationHeader.innerHTML = '✓ Correct Answer';
      } else {
        explanationHeader.className = 'explanation-header incorrect-text';
        explanationHeader.innerHTML = `✗ Incorrect — Correct Answer: ${optionKeys[currentQ.correctIndex]}) ${currentQ.options[currentQ.correctIndex]}`;
      }

      explanationBody.textContent = currentQ.explanation;
    }

    // NEXT QUESTION OR FINISH
    function handleNextQuestion() {
      if (currentIndex < quizData.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        showResults();
      }
    }

    // SHOW RESULTS SCREEN
    function showResults() {
      quizCard.style.display = 'none';
      resultsScreen.classList.add('active');

      const percentage = Math.round((score / quizData.length) * 100);
      document.getElementById('finalPercentage').textContent = `${percentage}%`;
      document.getElementById('finalCorrect').textContent = score;
      document.getElementById('finalIncorrect').textContent = quizData.length - score;

      // Render breakdown list
      const breakdownList = document.getElementById('breakdownList');
      breakdownList.innerHTML = '';

      quizData.forEach((q, idx) => {
        const userAnsIdx = userAnswers[idx];
        const isCorrect = userAnsIdx === q.correctIndex;

        const item = document.createElement('div');
        item.className = `review-item ${isCorrect ? 'is-correct' : 'is-incorrect'}`;

        item.innerHTML = `
          <div class="review-q-number">Question ${idx + 1} (${q.category})</div>
          <div class="review-q-text">${q.question}</div>
          <div class="review-ans-row">
            ${!isCorrect ? `<div class="user-ans"><strong>Your Answer:</strong> ${userAnsIdx !== null ? optionKeys[userAnsIdx] + ') ' + q.options[userAnsIdx] : 'Not Answered'}</div>` : ''}
            <div class="correct-ans"><strong>Correct Answer:</strong> ${optionKeys[q.correctIndex]}) ${q.options[q.correctIndex]}</div>
          </div>
          <div class="review-exp"><strong>Explanation:</strong> ${q.explanation}</div>
        `;

        breakdownList.appendChild(item);
      });
    }

    // RESTART QUIZ
    function restartQuiz() {
      currentIndex = 0;
      score = 0;
      userAnswers.fill(null);

      resultsScreen.classList.remove('active');
      quizCard.style.display = 'flex';
      renderQuestion();
    }

    // KEYBOARD NAVIGATION (A, B, C, D or 1, 2, 3, 4 for options; Enter/Space for Next)
    document.addEventListener('keydown', (e) => {
      if (resultsScreen.classList.contains('active')) return;

      const key = e.key.toUpperCase();
      if (['A', '1'].includes(key)) trySelectOption(0);
      if (['B', '2'].includes(key)) trySelectOption(1);
      if (['C', '3'].includes(key)) trySelectOption(2);
      if (['D', '4'].includes(key)) trySelectOption(3);

      if (['ENTER', ' '].includes(e.key) && !nextBtn.disabled) {
        e.preventDefault();
        handleNextQuestion();
      }
    });

    function trySelectOption(index) {
      if (userAnswers[currentIndex] === null) {
        selectOption(index);
      }
    }

    // INITIALIZE ON LOAD
    window.onload = initQuiz;
  </script>
