<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>National Schemes & Policy Practice Quiz</title>
  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --bg-secondary: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-light: #eff6ff;
      --success-color: #059669;
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      --error-color: #dc2626;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    [data-theme="dark"] {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --bg-secondary: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent-color: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-light: #1e3a8a;
      --success-color: #10b981;
      --success-bg: #064e3b;
      --success-border: #047857;
      --error-color: #ef4444;
      --error-bg: #7f1d1d;
      --error-border: #b91c1c;
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* HEADER */
    header {
      height: 52px;
      padding: 0 16px;
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: var(--card-shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--accent-color);
    }

    .brand-badge {
      background: var(--accent-light);
      color: var(--accent-color);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-toggle-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .theme-toggle-btn:hover {
      background: var(--border-color);
    }

    /* MAIN CONTAINER */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 16px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      overflow: hidden;
      position: relative;
    }

    /* PROGRESS BAR */
    .progress-container {
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .progress-bar-bg {
      height: 6px;
      background: var(--bg-secondary);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent-color);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* CARD CONTAINER */
    .quiz-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* QUESTION SECTION */
    .question-section {
      flex-shrink: 0;
      margin-bottom: 12px;
    }

    .question-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent-color);
      background: var(--accent-light);
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
    }

    .question-text {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text-primary);
    }

    /* SPECIAL FORMATTING FOR STATEMENTS / CALLOUTS */
    .statement-box {
      background: var(--bg-secondary);
      border-left: 3px solid var(--accent-color);
      padding: 8px 12px;
      border-radius: 4px;
      margin-top: 8px;
      font-size: 0.9rem;
      line-height: 1.35;
    }

    .statement-box p {
      margin-bottom: 4px;
    }
    .statement-box p:last-child {
      margin-bottom: 0;
    }

    /* OPTIONS SECTION */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    @media (max-width: 640px) {
      .options-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }

    .option-btn {
      background-color: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      text-align: left;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: all 0.15s ease;
      line-height: 1.3;
      user-select: none;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent-color);
      background-color: var(--accent-light);
    }

    .option-prefix {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    /* OPTION STATES */
    .option-btn.selected-correct {
      background-color: var(--success-bg) !important;
      border-color: var(--success-color) !important;
      color: var(--text-primary) !important;
    }
    .option-btn.selected-correct .option-prefix {
      background: var(--success-color);
      color: #fff;
      border-color: var(--success-color);
    }

    .option-btn.selected-incorrect {
      background-color: var(--error-bg) !important;
      border-color: var(--error-color) !important;
      color: var(--text-primary) !important;
    }
    .option-btn.selected-incorrect .option-prefix {
      background: var(--error-color);
      color: #fff;
      border-color: var(--error-color);
    }

    .option-btn.highlight-correct {
      border-color: var(--success-color) !important;
      background-color: var(--success-bg) !important;
    }

    .option-btn:disabled {
      cursor: default;
      opacity: 0.95;
    }

    /* EXPLANATION BOX */
    .explanation-container {
      flex: 1;
      overflow-y: auto;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.85rem;
      line-height: 1.4;
      display: none;
      animation: fadeIn 0.2s ease-in-out;
    }

    .explanation-title {
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .explanation-title.correct { color: var(--success-color); }
    .explanation-title.incorrect { color: var(--error-color); }

    /* FOOTER CONTROL BAR */
    .quiz-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .stat-pill {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      gap: 12px;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.15s ease;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* END SCREEN RESULTS */
    .results-screen {
      display: none;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 16px;
      box-shadow: var(--card-shadow);
    }

    .results-header {
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .results-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .score-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin: 8px 0;
      padding: 8px 20px;
      background: var(--bg-secondary);
      border-radius: 30px;
      border: 1px solid var(--border-color);
    }

    .score-value {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-color);
    }

    .score-percentage {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .results-stats-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 4px;
    }

    .stat-correct { color: var(--success-color); }
    .stat-incorrect { color: var(--error-color); }

    /* INCORRECT QUESTIONS LIST */
    .review-section {
      flex: 1;
      overflow-y: auto;
      margin: 12px 0;
      padding-right: 4px;
    }

    .review-title {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .review-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }

    .review-q-num {
      font-weight: 700;
      color: var(--accent-color);
      margin-bottom: 4px;
    }

    .review-q-text {
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .review-ans {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 6px;
      padding: 6px 10px;
      border-radius: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
    }

    .user-ans { color: var(--error-color); font-weight: 600; }
    .correct-ans { color: var(--success-color); font-weight: 600; }

    .review-exp {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.35;
      font-style: italic;
    }

    .results-footer {
      display: flex;
      justify-content: center;
      padding-top: 10px;
      border-top: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    /* SCROLLBAR STYLING */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand">
      <span>🏛️ GovtSchemes ExamPrep</span>
      <span class="brand-badge">2025-26 Edition</span>
    </div>
    <div class="header-actions">
      <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span>
        <span id="themeText">Dark</span>
      </button>
    </div>
  </header>

  <!-- MAIN QUIZ DISPLAY -->
  <main>
    <div id="quizContainer" style="display: flex; flex-direction: column; height: 100%; width: 100%;">
      
      <!-- PROGRESS -->
      <div class="progress-container">
        <div class="progress-info">
          <span id="questionCounter">Question 1 of 25</span>
          <span id="scoreTracker">Score: 0 / 0</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
      </div>

      <!-- MAIN CARD -->
      <div class="quiz-card">
        
        <!-- QUESTION CONTENT -->
        <div class="question-section">
          <span class="question-tag" id="questionTag">National Mission / Scheme</span>
          <div class="question-text" id="questionText">Loading question...</div>
          <div id="statementContainer"></div>
        </div>

        <!-- OPTIONS GRID -->
        <div class="options-grid" id="optionsGrid">
          <!-- Dynamically populated -->
        </div>

        <!-- EXPLANATION BOX -->
        <div class="explanation-container" id="explanationBox">
          <div class="explanation-title" id="explanationTitle">
            <!-- Icon + Status -->
          </div>
          <div id="explanationText"></div>
        </div>

        <!-- CONTROL FOOTER -->
        <div class="quiz-footer">
          <div class="stat-pill">
            <span>Accuracy: <strong id="accuracyPill">100%</strong></span>
          </div>
          <button class="btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>
            <span>Next Question</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
        </div>

      </div>
    </div>

    <!-- RESULTS DISPLAY -->
    <div class="results-screen" id="resultsScreen">
      <div class="results-header">
        <h2 class="results-title">Quiz Completed! 🎉</h2>
        <div class="score-badge">
          <span class="score-value" id="finalScoreVal">0 / 25</span>
          <span class="score-percentage" id="finalPercentVal">(0%)</span>
        </div>
        <div class="results-stats-row">
          <span class="stat-correct">✓ Correct: <strong id="totalCorrectVal">0</strong></span>
          <span class="stat-incorrect">✗ Incorrect: <strong id="totalIncorrectVal">0</strong></span>
        </div>
      </div>

      <div class="review-section">
        <div class="review-title" id="reviewHeaderTitle">Review Incorrect Answers</div>
        <div id="incorrectList">
          <!-- Dynamically inserted -->
        </div>
      </div>

      <div class="results-footer">
        <button class="btn-primary" onclick="restartQuiz()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          <span>Restart Quiz</span>
        </button>
      </div>
    </div>
  </main>

  <script>
    const questionsData = [
      {
        id: 1,
        tag: "Ministry of Agriculture",
        question: "Under the National Mission on Natural Farming (NMNF), which of the following represents the microbial soil inoculant among the four pillars of Zero Budget Natural Farming (ZBNF)?",
        options: ["Bijamrita", "Jiwamrita", "Mulching", "Whapasa"],
        answerIndex: 1,
        explanation: "Under the four pillars of ZBNF in the National Mission on Natural Farming (NMNF), Jiwamrita is the microbial soil inoculant, while Bijamrita is for seed treatment, Mulching is for soil cover/weed suppression, and Whapasa manages moisture and aeration."
      },
      {
        id: 2,
        tag: "Financial Outlays",
        question: "What is the approved financial outlay for the National Mission on Natural Farming (NMNF) up to 2025–26?",
        options: ["₹64,180 crore", "₹6,839 crore", "₹2,481 crore", "₹27,360 crore"],
        answerIndex: 2,
        explanation: "The National Mission on Natural Farming (NMNF) was approved in 2024 with a total financial outlay of ₹2,481 crore up to 2025–26."
      },
      {
        id: 3,
        tag: "Ministry of Education",
        question: "Pradhan Mantri Uchchatar Shiksha Abhiyan (PM-USHA) represents which restructured phase of the Rashtriya Uchchatar Shiksha Abhiyan (RUSA)?",
        options: ["1st Phase", "2nd Phase", "3rd Phase", "4th Phase"],
        answerIndex: 2,
        explanation: "PM-USHA, launched in 2023 under the Ministry of Education, represents the 3rd Phase restructured from RUSA."
      },
      {
        id: 4,
        tag: "Ministry of Home Affairs",
        question: "Which of the following statements regarding the Vibrant Villages Programme (VVP) is correct according to the text?",
        options: [
          "VVP-1 was a Central Sector Scheme covering 2,000 villages across 17 States and UTs.",
          "VVP-2 was approved in 2025 as a Central Sector Scheme with an outlay of ₹6,839 crore.",
          "VVP-1 is implemented by the Ministry of Housing and Urban Affairs.",
          "VVP-2 targets exclusively northern border villages along the India-China border across 3 sectors."
        ],
        answerIndex: 1,
        explanation: "VVP-2 is a Central Sector Scheme approved in 2025 with an outlay of ₹6,839 crore covering ~2,000 villages across 17 States/UTs. VVP-1 was a Centrally Sponsored Scheme approved in 2023 targeting northern border villages. Both fall under the Ministry of Home Affairs."
      },
      {
        id: 5,
        tag: "Ministry of Health & Family Welfare",
        question: "What is the total financial outlay approved for the PM Ayushman Bharat Health Infrastructure Mission (PM-ABHIM) for the period 2021–22 to 2025–26?",
        options: ["₹60,000 crore", "₹64,180 crore", "₹27,360 crore", "₹6,839 crore"],
        answerIndex: 1,
        explanation: "PM-ABHIM was approved by the Union Cabinet on September 15, 2021, with a total financial outlay of ₹64,180 crore."
      },
      {
        id: 6,
        tag: "Ministry of Women & Child Development",
        question: "Under Mission Vatsalya, what is the Centre-to-State fund sharing pattern for Northeastern and Himalayan States, as well as Jammu & Kashmir?",
        options: ["60:40", "50:50", "90:10", "100:0"],
        answerIndex: 2,
        explanation: "For Mission Vatsalya (under the Ministry of Women and Child Development), the funding pattern is 60:40 for regular States/UTs with legislature, 90:10 for Northeastern & Himalayan States and J&K, and 100% Central funding for UTs without legislature."
      },
      {
        id: 7,
        tag: "Women Safety & Empowerment",
        question: "Under the sub-schemes of Mission Shakti, which of the following components falls under Sambal (Safety & Security)?",
        options: [
          "Pradhan Mantri Matru Vandana Yojana (PMMVY)",
          "Sakhi Niwas",
          "Palna",
          "Beti Bachao Beti Padhao (BBBP)"
        ],
        answerIndex: 3,
        explanation: "Mission Shakti consists of two sub-schemes: Sambal (includes One Stop Centres, Women Helpline, BBBP, Nari Adalat) and Samarthya (includes PMMVY, Shakti Sadan, Sakhi Niwas, Palna, and Sankalp)."
      },
      {
        id: 8,
        tag: "Skill Development",
        question: "Which scheme approved in May 2025 aims to modernize 1,000 Government ITIs and upgrade 5 National Skill Training Institutes (NSTIs)?",
        options: ["DDU-GKY", "PM-USHA", "PM-SETU", "PM-AJAY"],
        answerIndex: 2,
        explanation: "PM-SETU (Pradhan Mantri Skill and Employability Transformation) under the Ministry of Skill Development and Entrepreneurship was approved in May 2025 with an outlay of ₹60,000 crore to modernize 1,000 ITIs and upgrade 5 NSTIs."
      },
      {
        id: 9,
        tag: "Rural Skill Training",
        question: "What is the target age group for skill training under the Deen Dayal Upadhyaya Grameen Kaushalya Yojana (DDU-GKY)?",
        options: ["18 to 45 years", "15 to 35 years", "18 to 60 years", "14 to 28 years"],
        answerIndex: 1,
        explanation: "DDU-GKY, launched in 2014 under the Ministry of Rural Development, provides skill training to rural youth aged 15 to 35 years from poor families."
      },
      {
        id: 10,
        tag: "Tribal Welfare",
        question: "To be eligible under the Dharti Aaba Janjatiya Gram Utkarsh Abhiyan (launched in 2024), a village must have a population of 500 or more with at least what percentage of tribal population?",
        options: ["25%", "40%", "50%", "75%"],
        answerIndex: 2,
        explanation: "Villages qualify under the Dharti Aaba Janjatiya Gram Utkarsh Abhiyan if they have a population of 500 or more with at least 50% tribal population, or are located in aspirational districts with significant tribal concentration."
      },
      {
        id: 11,
        tag: "National Health Mission",
        question: "Under the National Programme for Prevention and Control of Non-Communicable Diseases (NP-NCD), what is the primary target demography for screening, diagnosis, and treatment?",
        options: [
          "Children under 5 years",
          "Individuals aged 18 years and above",
          "Individuals aged 30 years and above",
          "Senior citizens aged 60 years and above"
        ],
        answerIndex: 2,
        explanation: "NP-NCD (renamed from NPCDCS in 2023 under the National Health Mission) focuses on individuals aged 30 years and above."
      },
      {
        id: 12,
        tag: "Urban Housing",
        question: "Under PMAY-U 2.0 (2024 to 2029), what is the defined annual income limit for the Low Income Group (LIG) category?",
        options: ["Up to ₹3 Lakh", "₹3 Lakh to ₹6 Lakh", "₹6 Lakh to ₹9 Lakh", "₹9 Lakh to ₹18 Lakh"],
        answerIndex: 1,
        explanation: "Under PMAY-U 2.0, the income criteria are: EWS (up to ₹3 Lakh), LIG (₹3 Lakh to ₹6 Lakh), and MIG (₹6 Lakh to ₹9 Lakh / ₹18 Lakh)."
      },
      {
        id: 13,
        tag: "Jal Jeevan Mission",
        question: "Which was the first state in India to achieve 100% tap water connectivity under the Har Ghar Jal initiative of the Jal Jeevan Mission?",
        options: ["Kerala", "Gujarat", "Goa", "Haryana"],
        answerIndex: 2,

    // State Variables
    let currentIdx = 0;
    let score = 0;
    let userAnswers = []; // Array storing user's selected index for each question
    let isDarkMode = false;

    // DOM Elements
    const questionCounter = document.getElementById("questionCounter");
    const scoreTracker = document.getElementById("scoreTracker");
    const progressBar = document.getElementById("progressBar");
    const questionTag = document.getElementById("questionTag");
    const questionText = document.getElementById("questionText");
    const statementContainer = document.getElementById("statementContainer");
    const optionsGrid = document.getElementById("optionsGrid");
    const explanationBox = document.getElementById("explanationBox");
    const explanationTitle = document.getElementById("explanationTitle");
    const explanationText = document.getElementById("explanationText");
    const nextBtn = document.getElementById("nextBtn");
    const accuracyPill = document.getElementById("accuracyPill");

    // Initialize Quiz
    function initQuiz() {
      currentIdx = 0;
      score = 0;
      userAnswers = new Array(questionsData.length).fill(null);
      
      document.getElementById("quizContainer").style.display = "flex";
      document.getElementById("resultsScreen").style.display = "none";
      
      renderQuestion();
    }

    function renderQuestion() {
      const q = questionsData[currentIdx];

      // Update progress
      const total = questionsData.length;
      questionCounter.textContent = `Question ${currentIdx + 1} of ${total}`;
      scoreTracker.textContent = `Score: ${score} / ${currentIdx}`;
      progressBar.style.width = `${((currentIdx) / total) * 100}%`;

      // Update Accuracy
      const attempted = currentIdx;
      const acc = attempted > 0 ? Math.round((score / attempted) * 100) : 100;
      accuracyPill.textContent = `${acc}%`;

      // Question content
      questionTag.textContent = q.tag || "Govt Scheme";
      questionText.textContent = q.question;
      statementContainer.innerHTML = "";

      // Clear previous explanation
      explanationBox.style.display = "none";
      nextBtn.disabled = true;

      // Render Options
      optionsGrid.innerHTML = "";
      const prefixes = ["A", "B", "C", "D"];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.onclick = () => selectOption(idx);
        btn.innerHTML = `
          <span class="option-prefix">${prefixes[idx]}</span>
          <span>${opt}</span>
        `;
        optionsGrid.appendChild(btn);
      });
    }

    function selectOption(selectedIdx) {
      const q = questionsData[currentIdx];
      userAnswers[currentIdx] = selectedIdx;

      const isCorrect = (selectedIdx === q.answerIndex);
      if (isCorrect) score++;

      // Disable all options
      const buttons = optionsGrid.querySelectorAll(".option-btn");
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === selectedIdx) {
          btn.classList.add(isCorrect ? "selected-correct" : "selected-incorrect");
        } else if (idx === q.answerIndex) {
          btn.classList.add("highlight-correct");
        }
      });

      // Show Explanation
      explanationBox.style.display = "block";
      if (isCorrect) {
        explanationTitle.className = "explanation-title correct";
        explanationTitle.innerHTML = "<span>✓ Correct Answer!</span>";
      } else {
        explanationTitle.className = "explanation-title incorrect";
        explanationTitle.innerHTML = `<span>✗ Incorrect (Correct: ${["A","B","C","D"][q.answerIndex]})</span>`;
      }
      explanationText.textContent = q.explanation;

      // Enable Next Button
      nextBtn.disabled = false;

      // Update score tracker display instantly
      scoreTracker.textContent = `Score: ${score} / ${currentIdx + 1}`;
      const attempted = currentIdx + 1;
      const acc = Math.round((score / attempted) * 100);
      accuracyPill.textContent = `${acc}%`;
    }

    function nextQuestion() {
      if (currentIdx < questionsData.length - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById("quizContainer").style.display = "none";
      document.getElementById("resultsScreen").style.display = "flex";

      const total = questionsData.length;
      const percentage = Math.round((score / total) * 100);

      document.getElementById("finalScoreVal").textContent = `${score} / ${total}`;
      document.getElementById("finalPercentVal").textContent = `(${percentage}%)`;
      document.getElementById("totalCorrectVal").textContent = score;
      document.getElementById("totalIncorrectVal").textContent = total - score;

      // Render incorrect questions list
      const incorrectList = document.getElementById("incorrectList");
      incorrectList.innerHTML = "";

      let incorrectCount = 0;
      questionsData.forEach((q, idx) => {
        const userAns = userAnswers[idx];
        if (userAns !== q.answerIndex) {
          incorrectCount++;
          const card = document.createElement("div");
          card.className = "review-card";

          const userChoiceText = userAns !== null ? `${["A","B","C","D"][userAns]}) ${q.options[userAns]}` : "Not Answered";
          const correctChoiceText = `${["A","B","C","D"][q.answerIndex]}) ${q.options[q.answerIndex]}`;

          card.innerHTML = `
            <div class="review-q-num">Q${idx + 1}. ${q.tag}</div>
            <div class="review-q-text">${q.question}</div>
            <div class="review-ans">
              <span class="user-ans">Your Answer: ${userChoiceText}</span>
              <span class="correct-ans">Correct Answer: ${correctChoiceText}</span>
            </div>
            <div class="review-exp"><strong>Explanation:</strong> ${q.explanation}</div>
          `;
          incorrectList.appendChild(card);
        }
      });

      const reviewHeaderTitle = document.getElementById("reviewHeaderTitle");
      if (incorrectCount === 0) {
        reviewHeaderTitle.textContent = "Perfect Score! No Incorrect Answers! 🌟";
      } else {
        reviewHeaderTitle.textContent = `Review Incorrect Answers (${incorrectCount})`;
      }
    }

    function restartQuiz() {
      initQuiz();
    }

    // Theme Toggle Functionality
    function toggleTheme() {
      isDarkMode = !isDarkMode;
      const themeIcon = document.getElementById("themeIcon");
      const themeText = document.getElementById("themeText");

      if (isDarkMode) {
        document.documentElement.setAttribute("data-theme", "dark");
        themeIcon.textContent = "☀️";
        themeText.textContent = "Light";
      } else {
        document.documentElement.removeAttribute("data-theme");
        themeIcon.textContent = "🌙";
        themeText.textContent = "Dark";
      }
    }

    // Keyboard navigation support
    document.addEventListener("keydown", (e) => {
      if (document.getElementById("quizContainer").style.display === "none") return;

      const key = e.key.toUpperCase();
      if (["1", "2", "3", "4", "A", "B", "C", "D"].includes(key)) {
        let index = -1;
        if (key === "1" || key === "A") index = 0;
        if (key === "2" || key === "B") index = 1;
        if (key === "3" || key === "C") index = 2;
        if (key === "4" || key === "D") index = 3;

        const buttons = optionsGrid.querySelectorAll(".option-btn");
        if (buttons[index] && !buttons[index].disabled) {
          selectOption(index);
        }
      } else if (e.key === "Enter" || e.key === " ") {
        if (!nextBtn.disabled) {
          e.preventDefault();
          nextQuestion();
        }
      }
    });

    // Run on start
    initQuiz();
  </script>
