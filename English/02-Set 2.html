<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSC Vocabulary Quiz App</title>
  <style>
    /* ==========================================
       CSS VARIABLES & THEMES
       ========================================== */
    :root {
      --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
      --card-bg: #ffffff;
      --text-main: #102a43;
      --text-muted: #627d98;
      --border-color: #bcccdc;
      
      --primary: #2b6cb0;
      --primary-hover: #1e4e8c;
      
      --correct-bg: #e6fffa;
      --correct-border: #319795;
      --correct-text: #234e52;
      
      --incorrect-bg: #fff5f5;
      --incorrect-border: #e53e3e;
      --incorrect-text: #742a2a;
      
      --box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      --callout-bg: #f8fafc;
      --option-bg: #f7fafc;
      --option-hover: #edf2f7;
    }

    [data-theme="dark"] {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      
      --correct-bg: #064e3b;
      --correct-border: #10b981;
      --correct-text: #ecfdf5;
      
      --incorrect-bg: #7f1d1d;
      --incorrect-border: #ef4444;
      --incorrect-text: #fef2f2;
      
      --box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      --callout-bg: #0f172a;
      --option-bg: #334155;
      --option-hover: #475569;
    }

    /* ==========================================
       RESET & BASE STYLES
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      overflow: hidden; /* Prevents outer page scrolling */
    }

    .app-container {
      width: 100%;
      max-width: 800px;
      height: 100%;
      max-height: 680px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--box-shadow);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-color);
      overflow: hidden;
      position: relative;
    }

    /* ==========================================
       HEADER SECTION
       ========================================== */
    header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.02);
      flex-shrink: 0;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-toggle {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-toggle:hover {
      border-color: var(--primary);
    }

    .progress-badge {
      font-size: 0.85rem;
      font-weight: 600;
      background: var(--callout-bg);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    /* ==========================================
       QUIZ CONTAINER (Viewport-Optimized)
       ========================================== */
    .quiz-body {
      flex: 1;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto; /* Fallback for small screens */
    }

    /* Question Container */
    .question-box {
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    /* Complex Question Types (Statements & Match) */
    .statement-box {
      background: var(--callout-bg);
      border-left: 4px solid var(--primary);
      border-radius: 6px;
      padding: 10px 14px;
      margin: 8px 0;
      font-family: monospace, monospace;
      font-size: 0.95rem;
      border-top: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
    }

    .match-table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0;
      font-size: 0.9rem;
    }

    .match-table th, .match-table td {
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      text-align: left;
    }

    .match-table th {
      background: var(--callout-bg);
      color: var(--primary);
    }

    /* Options Grid */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    @media (max-width: 600px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
    }

    .option-btn {
      background: var(--option-bg);
      border: 1.5px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      text-align: left;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .option-btn:hover:not(:disabled) {
      background: var(--option-hover);
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.8;
    }

    .option-btn.correct {
      background: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-text) !important;
      font-weight: 700;
    }

    .option-btn.incorrect {
      background: var(--incorrect-bg) !important;
      border-color: var(--incorrect-border) !important;
      color: var(--incorrect-text) !important;
    }

    /* Explanation Box */
    .explanation-box {
      background: var(--callout-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.88rem;
      line-height: 1.35;
      display: none;
      margin-bottom: 8px;
      max-height: 110px;
      overflow-y: auto;
    }

    .explanation-box.visible {
      display: block;
      animation: fadeIn 0.2s ease-in;
    }

    .explanation-title {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    /* Footer & Sticky Next Button */
    .quiz-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    /* ==========================================
       RESULTS SCREEN
       ========================================== */
    .results-container {
      display: none;
      flex-direction: column;
      height: 100%;
      padding: 20px;
      overflow-y: auto;
    }

    .results-container.visible {
      display: flex;
    }

    .score-card {
      background: var(--callout-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .score-big {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary);
      margin: 4px 0;
    }

    .score-stats {
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 0.95rem;
      margin-top: 8px;
    }

    .stat-correct { color: var(--correct-border); font-weight: 700; }
    .stat-incorrect { color: var(--incorrect-border); font-weight: 700; }

    .breakdown-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    .breakdown-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
      margin-bottom: 16px;
    }

    .breakdown-item {
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.88rem;
    }

    .breakdown-q {
      font-weight: 600;
      margin-bottom: 6px;
    }

    .breakdown-ans {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 0.82rem;
    }

    .your-ans { color: var(--incorrect-border); }
    .correct-ans { color: var(--correct-border); font-weight: 600; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

    </div>
  </div>

        answer: 1,
        word: "Discernible",

    /* ==========================================
       APP STATE
       ========================================== */
    let currentIndex = 0;
    let score = 0;
    let userAnswers = []; // Records user responses for results

    /* DOM Elements */
    const quizScreen = document.getElementById('quiz-screen');
    const resultsScreen = document.getElementById('results-screen');
    const questionText = document.getElementById('question-text');
    const complexContent = document.getElementById('complex-content');
    const optionsGrid = document.getElementById('options-grid');
    const explanationBox = document.getElementById('explanation-box');
    const expText = document.getElementById('exp-text');
    const expTitle = document.getElementById('exp-title');
    const nextBtn = document.getElementById('next-btn');
    const progressBadge = document.getElementById('progress-badge');
    const themeToggleBtn = document.getElementById('theme-toggle-btn');
    const themeIcon = document.getElementById('theme-icon');

    /* Results Elements */
    const scorePercentage = document.getElementById('score-percentage');
    const scoreText = document.getElementById('score-text');
    const statCorrectCount = document.getElementById('stat-correct-count');
    const statIncorrectCount = document.getElementById('stat-incorrect-count');
    const breakdownList = document.getElementById('breakdown-list');
    const breakdownHeader = document.getElementById('breakdown-header');
    const restartBtn = document.getElementById('restart-btn');

    /* ==========================================
       THEME MANAGEMENT
       ========================================== */
    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.body.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.body.setAttribute('data-theme', newTheme);
      themeIcon.textContent = newTheme === 'light' ? '🌙' : '☀️';
      themeToggleBtn.childNodes[1].textContent = newTheme === 'light' ? ' Dark' : ' Light';
    });

    /* ==========================================
       QUIZ ENGINE LOGIC
       ========================================== */
    function loadQuestion() {
      const q = quizData[currentIndex];
      
      // Update Progress
      progressBadge.textContent = `Q ${currentIndex + 1} / ${quizData.length}`;
      
      // Reset State & UI
      explanationBox.classList.remove('visible');
      nextBtn.disabled = true;
      optionsGrid.innerHTML = '';
      complexContent.innerHTML = '';

      // Format Question Text
      questionText.textContent = q.question;

      // Render Options
      q.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.onclick = () => selectOption(index);
        optionsGrid.appendChild(btn);
      });

      // Update Next Button Text for Last Question
      if (currentIndex === quizData.length - 1) {
        nextBtn.textContent = 'View Results 🏆';
      } else {
        nextBtn.textContent = 'Next Question ➔';
      }
    }

    function selectOption(selectedIndex) {
      const q = quizData[currentIndex];
      const buttons = optionsGrid.querySelectorAll('.option-btn');
      
      // Disable all options
      buttons.forEach(btn => btn.disabled = true);

      const isCorrect = selectedIndex === q.answer;

      if (isCorrect) {
        buttons[selectedIndex].classList.add('correct');
        score++;
        expTitle.textContent = "✓ Correct!";
        expTitle.style.color = "var(--correct-border)";
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[q.answer].classList.add('correct');
        expTitle.textContent = "✕ Incorrect";
        expTitle.style.color = "var(--incorrect-border)";
      }

      // Record Answer
      userAnswers[currentIndex] = {
        questionId: q.id,
        selected: selectedIndex,
        isCorrect: isCorrect
      };

      // Populate Explanation
      expText.innerHTML = `
        <strong>${q.word}</strong>: ${q.meaning}<br>
        <em>Why:</em> ${q.why}<br>
        <div style="margin-top:4px; font-size:0.8rem; opacity:0.85;">
          ${q.otherOptions.join(' | ')}
        </div>
      `;
      explanationBox.classList.add('visible');

      // Enable Next Button
      nextBtn.disabled = false;
    }

    nextBtn.addEventListener('click', () => {
      if (currentIndex < quizData.length - 1) {
        currentIndex++;
        loadQuestion();
      } else {
        showResults();
      }
    });

    /* ==========================================
       RESULTS & REVIEW BREAKDOWN
       ========================================== */
    function showResults() {
      quizScreen.style.display = 'none';
      resultsScreen.classList.add('visible');

      const pct = Math.round((score / quizData.length) * 100);
      scorePercentage.textContent = `${pct}%`;
      scoreText.textContent = `${score} / ${quizData.length}`;
      statCorrectCount.textContent = score;
      const incorrectCount = quizData.length - score;
      statIncorrectCount.textContent = incorrectCount;

      breakdownList.innerHTML = '';

      if (incorrectCount === 0) {
        breakdownHeader.textContent = "Perfect Score! No Incorrect Answers 🎉";
      } else {
        breakdownHeader.textContent = `Incorrect Answers Review (${incorrectCount})`;
        
        userAnswers.forEach((ans, idx) => {
          if (!ans.isCorrect) {
            const q = quizData[idx];
            const item = document.createElement('div');
            item.className = 'breakdown-item';
            
            const userChoiceText = ans.selected !== undefined ? q.options[ans.selected] : "None";
            const correctChoiceText = q.options[q.answer];

            item.innerHTML = `
              <div class="breakdown-q">Q${idx + 1}: ${q.question.replace(/\n/g, ' ')}</div>
              <div class="breakdown-ans">
                <span class="your-ans">✖ Your Answer: ${userChoiceText}</span>
                <span class="correct-ans">✓ Correct Answer: ${correctChoiceText}</span>
              </div>
            `;
            breakdownList.appendChild(item);
          }
        });
      }
    }

    restartBtn.addEventListener('click', () => {
      currentIndex = 0;
      score = 0;
      userAnswers = [];
      resultsScreen.classList.remove('visible');
      quizScreen.style.display = 'flex';
      loadQuestion();
    });

    // Initialize Quiz on Load
    loadQuestion();
  </script>
</body>
</html>
