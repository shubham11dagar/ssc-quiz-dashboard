<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSC English Spelling Mastery Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #131d31;
      --card-border: #24324f;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --correct: #10b981;
      --correct-bg: rgba(16, 185, 129, 0.12);
      --correct-border: rgba(16, 185, 129, 0.4);
      --wrong: #f43f5e;
      --wrong-bg: rgba(244, 63, 94, 0.12);
      --wrong-border: rgba(244, 63, 94, 0.4);
      --btn-bg: #1c2942;
      --btn-hover: #26385a;
      --btn-border: #31446b;
      --tip-bg: #1e293b;
      --tip-border: #38bdf844;
      --tip-text: #7dd3fc;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --accent: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.12);
      --correct: #059669;
      --correct-bg: rgba(5, 150, 105, 0.1);
      --correct-border: rgba(5, 150, 105, 0.4);
      --wrong: #e11d48;
      --wrong-bg: rgba(225, 29, 72, 0.08);
      --wrong-border: rgba(225, 29, 72, 0.35);
      --btn-bg: #f1f5f9;
      --btn-hover: #e2e8f0;
      --btn-border: #cbd5e1;
      --tip-bg: #f0f9ff;
      --tip-border: #bae6fd;
      --tip-text: #0369a1;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 780px;
      height: 100%;
      max-height: 96vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top Navigation Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      margin-bottom: 8px;
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      background: var(--accent);
      color: #fff;
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-toggle-btn {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--text-main);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: 0.2s;
    }

    .theme-toggle-btn:hover {
      background: var(--btn-hover);
    }

    /* Progress Stats Bar */
    .progress-bar-container {
      background: var(--card-border);
      height: 6px;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #6366f1);
      width: 0%;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Main Quiz Viewport Card */
    .quiz-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      position: relative;
    }

    .question-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    .q-number-tag {
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid var(--tip-border);
      padding: 2px 8px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.75rem;
    }

    .question-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    /* Options 2x2 Grid for Maximum Compactness */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    @media (max-width: 580px) {
      .options-grid {
        grid-template-columns: 1fr;
        gap: 6px;
      }
      .question-title {
        font-size: 0.96rem;
      }
      .quiz-card {
        padding: 10px 12px;
      }
    }

    .option-btn {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease-in-out;
      user-select: none;
    }

    .option-btn:hover:not(:disabled) {
      background: var(--btn-hover);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn .opt-key {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      margin-right: 8px;
      opacity: 0.6;
      font-size: 0.8rem;
    }

    .option-btn.correct {
      background: var(--correct-bg) !important;
      border-color: var(--correct) !important;
      color: var(--correct) !important;
      font-weight: 700;
    }

    .option-btn.wrong {
      background: var(--wrong-bg) !important;
      border-color: var(--wrong) !important;
      color: var(--wrong) !important;
    }

    /* Explanation and SSC Exam Tip Box */
    .feedback-box {
      background: var(--tip-bg);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.8rem;
      line-height: 1.38;
      display: none;
      animation: fadeIn 0.2s ease-out;
      margin-top: 4px;
      flex-shrink: 1;
      overflow-y: auto;
      max-height: 110px;
    }

    .feedback-box.active {
      display: block;
    }

    .feedback-header {
      font-weight: 700;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .feedback-header.success {
      color: var(--correct);
    }

    .feedback-header.fail {
      color: var(--wrong);
    }

    .ssc-tip {
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px dashed var(--btn-border);
      color: var(--tip-text);
      font-size: 0.74rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .ssc-tag {
      background: var(--accent);
      color: #ffffff;
      font-size: 0.62rem;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      text-transform: uppercase;
      margin-right: 4px;
      letter-spacing: 0.03em;
    }

    /* Bottom Control Bar */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding-top: 6px;
    }

    .live-score {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    .next-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 9px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .next-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .next-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    /* Results Screen */
    .results-screen {
      display: none;
      height: 100%;
      flex-direction: column;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px 20px;
      box-shadow: var(--shadow);
      min-height: 0;
    }

    .results-header {
      text-align: center;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .results-title {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .results-summary-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .metric-card {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }

    .metric-val {
      font-size: 1.25rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
    }

    .metric-val.score { color: var(--accent); }
    .metric-val.correct { color: var(--correct); }
    .metric-val.wrong { color: var(--wrong); }

    .metric-lbl {
      font-size: 0.7rem;
      color: var(--text-sub);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .mistakes-container {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 12px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: var(--bg);
      padding: 8px;
    }

    .mistakes-container::-webkit-scrollbar {
      width: 5px;
    }
    .mistakes-container::-webkit-scrollbar-thumb {
      background: var(--btn-border);
      border-radius: 4px;
    }

    .mistake-item {
      padding: 8px;
      border-bottom: 1px solid var(--card-border);
      font-size: 0.78rem;
    }

    .mistake-item:last-child {
      border-bottom: none;
    }

    .mistake-q {
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 3px;
    }

    .mistake-answers {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.74rem;
    }

    .user-ans {
      color: var(--wrong);
      font-weight: 600;
    }

    .correct-ans {
      color: var(--correct);
      font-weight: 700;
    }

    .restart-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 9px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }

    .restart-btn:hover {
      opacity: 0.9;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body data-theme="dark">

  <div class="app-container">
    <!-- Top Header -->
    <header>
      <div class="brand">
        <span class="brand-badge">SSC CGL/CHSL</span>
        <span>Spelling Mastery Test</span>
      </div>
      <div class="header-actions">
        <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle Theme">
          <span id="themeIcon">☀️</span> <span id="themeText">Light</span>
        </button>
      </div>
    </header>

    <!-- Progress Indicator -->
    <div class="progress-bar-container">
      <div id="progressFill" class="progress-fill"></div>
    </div>

    <!-- Active Quiz Card -->
    <main id="quizCard" class="quiz-card">
      <div class="question-meta">
        <span id="questionNumberTag" class="q-number-tag">Q. 01 / 40</span>
        <span id="questionCategory" style="font-size: 0.72rem; color: var(--text-sub);">Vocabulary & Orthography</span>
      </div>

      <h2 id="questionPrompt" class="question-title">Loading question...</h2>

      <!-- 2x2 Options Grid -->
      <div id="optionsContainer" class="options-grid"></div>

      <!-- Feedback & SSC Exam Tip Box -->
      <div id="feedbackBox" class="feedback-box">
        <div id="feedbackHeader" class="feedback-header"></div>
        <div id="feedbackExplanation" style="color: var(--text-main);"></div>
        <div id="feedbackTip" class="ssc-tip"></div>
      </div>

      <!-- Footer action bar -->
      <div class="footer-bar">
        <div id="scoreBadge" class="live-score">Score: 0 | Remaining: 40</div>
        <button id="nextBtn" class="next-btn" disabled>
          <span>Next</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
    </main>

    <!-- Results Screen -->
    <section id="resultsScreen" class="results-screen">
      <div class="results-header">
        <h2 class="results-title">Diagnostic Performance</h2>
        <p style="font-size: 0.8rem; color: var(--text-sub);">SSC Tier-I / Tier-II Orthography Evaluation</p>
      </div>

      <div class="results-summary-cards">
        <div class="metric-card">
          <div id="resultAccuracy" class="metric-val score">0%</div>
          <div class="metric-lbl">Accuracy</div>
        </div>
        <div class="metric-card">
          <div id="resultCorrect" class="metric-val correct">0</div>
          <div class="metric-lbl">Correct</div>
        </div>
        <div class="metric-card">
          <div id="resultIncorrect" class="metric-val wrong">0</div>
          <div class="metric-lbl">Incorrect</div>
        </div>
      </div>

      <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-sub); margin-bottom: 4px;">
        REVIEW OF INCORRECT ATTEMPTS
      </div>
      <div id="mistakesContainer" class="mistakes-container"></div>

      <button id="restartBtn" class="restart-btn">Restart Full Test</button>
    </section>
  </div>

  <script>
    const questionsData = [
      {
        id: 1,
        question: "Identify the misspelt word.",
        options: ["Sesquipedalian", "Anachronism", "Syzygy", "Kakishtocracy"],
        correctIndex: 3,
        explanation: "The correct spelling is 'Kakistocracy' (governance by the least suitable or worst citizens). The extra 'h' makes it invalid.",
        sscTip: "Frequent SSC pattern: Greek-rooted governance words ending in '-cracy' (Autocracy, Plutocracy, Ochlocracy, Aristocracy)."
      },
      {
        id: 2,
        question: "Spot the correct spelling of a word referring to the surgical removal of an appendix.",
        options: ["Appendicectomy", "Appendectomy", "Appendecectomy", "Appendicetomy"],
        correctIndex: 0,
        explanation: "'Appendicectomy' is standard British English (frequently preferred in SSC answer keys), though 'appendectomy' is used in US English.",
        sscTip: "Medical suffix rule: '-ectomy' denotes surgical excision (Tonsillectomy, Mastectomy). Note the 'ice' vs 'ec' root retention."
      },
      {
        id: 3,
        question: "Identify the misspelt word.",
        options: ["Bureaucracy", "Acknowledge", "Privilege", "Seperate"],
        correctIndex: 3,
        explanation: "The correct spelling is 'Separate'. It contains 'par', never 'per'.",
        sscTip: "High Repeat SSC Trap: Remember the mnemonic: 'There is A RAT in sep-a-rat-e'."
      },
      {
        id: 4,
        question: "Spot the correct spelling of a word referring to the fear of long words.",
        options: [
          "Hippopotomonstrosesquipedaliophobia",
          "Hippopotomonstrousequipedaliophobia",
          "Hippopotamustrosesquippedaliophobia",
          "Hippopotomonstrosesquiphedaliophobia"
        ],
        correctIndex: 0,
        explanation: "'Hippopotomonstrosesquipedaliophobia' is spelled with 'sesqui-' (one and a half) and single 'p' in 'pedalio'.",
        sscTip: "The root 'sesquipedalian' means using words one and a half feet long (from Latin 'sesqui-' + 'ped-')."
      },
      {
        id: 5,
        question: "Select the correct spelling of the medical term for “inflammation of the liver.”",
        options: ["Hepatitus", "Hepatitis", "Heptatitis", "Hepattitis"],
        correctIndex: 1,
        explanation: "The correct spelling is 'Hepatitis'. The suffix for inflammation is '-itis'.",
        sscTip: "Suffix '-itis': Bronchitis, Arthritis, Dermatitis, Gastritis. Note single 't' in hepat- + -itis."
      },
      {
        id: 6,
        question: "Identify the misspelt word.",
        options: ["Porphyroblastic", "Querulous", "Salubrius", "Inadvertent"],
        correctIndex: 2,
        explanation: "The correct spelling is 'Salubrious' (health-giving or wholesome). It requires '-ious', not '-us'.",
        sscTip: "Opposite: 'Lugubrious' (mournful). SSC frequently pairs 'Salubrious' with antonym 'Insalubrious' or 'Noxious'."
      },
      {
        id: 7,
        question: "Spot the correct spelling of a word referring to the formation of blood cells.",
        options: ["Haematopoiesis", "Haemotopoiesis", "Haematopoesis", "Hematopoyesis"],
        correctIndex: 0,
        explanation: "The correct British spelling is 'Haematopoiesis' (from Greek 'haemato-' [blood] + 'poiesis' [making]).",
        sscTip: "British vs US: British retains 'ae' (Haematology, Paediatrics), while US drops 'a' (Hematology, Pediatrics)."
      },
      {
        id: 8,
        question: "Identify the misspelt word.",
        options: ["Acquiesce", "Desiccate", "Bourgeoisie", "Recalcitrantt"],
        correctIndex: 3,
        explanation: "The correct spelling is 'Recalcitrant' (uncooperative/defiant) with a single final 't'.",
        sscTip: "Double-consonant watchlist: 'Desiccate' has ONE 's' and DOUBLE 'c' (often tested in SSC CGL Tier 1/2)."
      },
      {
        id: 9,
        question: "Spot the correct spelling of a neurotransmitter crucial for mood regulation.",
        options: ["Serotonin", "Seratonin", "Sereotonin", "Seretonin"],
        correctIndex: 0,
        explanation: "'Serotonin' is spelled with 'sero-' (from serum) and '-tonin' (giving tone/pressure).",
        sscTip: "Common trap: Examiners replace 'o' with 'a' (Seratonin) or 'e' (Seretonin). Keep vowels in order: e - o - o - i."
      },
      {
        id: 10,
        question: "Select the correct spelling of a word which means the study of the structure of materials.",
        options: ["Crytallography", "Cristalography", "Crystallographi", "Crystallography"],
        correctIndex: 3,
        explanation: "The correct spelling is 'Crystallography' (double 'l' from crystal, plus suffix '-ography').",
        sscTip: "Derived from 'Crystal': Remember that when adding '-ography', the double 'l' is preserved: Crystal -> Crystallography."
      },
      {
        id: 11,
        question: "Select the INCORRECTLY spelt word.",
        options: ["Accommodate", "Occurrence", "Supercede", "Millennium"],
        correctIndex: 2,
        explanation: "The correct spelling is 'Supersede' (with an 's', from Latin 'supersedere'). It is the only English word ending in '-sede'.",
        sscTip: "Golden Rule for SSC: All other similar sound words end in '-cede' (Precede, Concede, Recede) or '-ceed' (Exceed, Proceed, Succeed)."
      },
      {
        id: 12,
        question: "Spot the correct spelling of the rare mineral used in making heat-resistant glass.",
        options: ["Borosillicate", "Borosilicate", "Borosyllicate", "Borosillicatte"],
        correctIndex: 1,
        explanation: "'Borosilicate' is formed from 'boro-' (boron) and 'silicate' (single 'l', single 't').",
        sscTip: "Look out for unnecessary doubling of 'l' and 't' in scientific compound names in SSC general English sections."
      },
      {
        id: 13,
        question: "Spot the correct spelling of the condition characterized by the formation of stones in the kidney.",
        options: ["Nephrolithiasis", "Nephrolythiasis", "Nephrolitheasis", "Nephreolithiasis"],
        correctIndex: 0,
        explanation: "'Nephrolithiasis' is derived from 'nephro-' (kidney) + 'lithos' (stone) + '-iasis' (morbid condition).",
        sscTip: "Root breakdown: 'Nephro' (Kidney) + 'Lith' (Stone). Compare with 'Cholelithiasis' (gallstones)."
      },
      {
        id: 14,
        question: "Select the correct spelling of a word that means the formation of a protein's specific structure.",
        options: ["Conformation", "Confermashun", "Conformassion", "Conformasion"],
        correctIndex: 0,
        explanation: "'Conformation' means the structural arrangement. Do not confuse with 'Confirmation' (validating/verification).",
        sscTip: "SSC Homophone alert: 'Conform' (yield/adapt to rules) vs 'Confirm' (substantiate/verify)."
      },
      {
        id: 15,
        question: "Identify the incorrectly spelt word.",
        options: ["Psithurism", "Vellichor", "Clinomania", "Saccharrine"],
        correctIndex: 3,
        explanation: "The correct spelling is 'Saccharine' (double 'c', single 'r').",
        sscTip: "SSC Pattern: Doubling the wrong letter. Remember: DOUBLE 'C' (cch), SINGLE 'R' (r)."
      },
      {
        id: 16,
        question: "Identify the misspelt word.",
        options: ["Obfuscate", "Recalcitrant", "Parapharnalia", "Vicissitude"],
        correctIndex: 2,
        explanation: "The correct spelling is 'Paraphernalia' (contains 'er', not 'ar' in the 3rd syllable: par-a-pher-na-li-a).",
        sscTip: "SSC Repeat Star: Paraphernalia originates from property a bride owned besides her dowry; note '-pher-'."
      },
      {
        id: 17,
        question: "Select the correct spelling of the medical adjective meaning ‘relating to the brain and spinal cord’.",
        options: ["Neuroal", "Neuraxial", "Neuraxel", "Neurexial"],
        correctIndex: 1,
        explanation: "The correct spelling is 'Neuraxial' (combining 'neur-' with 'axial').",
        sscTip: "Anatomical terminology in SSC exams relies on Latin stem + '-al' / '-ar' adjectival endings."
      },

    let currentQIndex = 0;
    let score = 0;
    let userAttempts = []; // Stores { question, selected, correct, isCorrect }

    // DOM Elements
    const questionPrompt = document.getElementById("questionPrompt");
    const questionNumberTag = document.getElementById("questionNumberTag");
    const optionsContainer = document.getElementById("optionsContainer");
    const feedbackBox = document.getElementById("feedbackBox");
    const feedbackHeader = document.getElementById("feedbackHeader");
    const feedbackExplanation = document.getElementById("feedbackExplanation");
    const feedbackTip = document.getElementById("feedbackTip");
    const nextBtn = document.getElementById("nextBtn");
    const scoreBadge = document.getElementById("scoreBadge");
    const progressFill = document.getElementById("progressFill");

    const quizCard = document.getElementById("quizCard");
    const resultsScreen = document.getElementById("resultsScreen");
    const resultAccuracy = document.getElementById("resultAccuracy");
    const resultCorrect = document.getElementById("resultCorrect");
    const resultIncorrect = document.getElementById("resultIncorrect");
    const mistakesContainer = document.getElementById("mistakesContainer");
    const restartBtn = document.getElementById("restartBtn");

    const themeToggle = document.getElementById("themeToggle");
    const themeIcon = document.getElementById("themeIcon");
    const themeText = document.getElementById("themeText");

    // Theme Switcher
    themeToggle.addEventListener("click", () => {
      const currentTheme = document.body.getAttribute("data-theme");
      const nextTheme = currentTheme === "dark" ? "light" : "dark";
      document.body.setAttribute("data-theme", nextTheme);
      themeIcon.textContent = nextTheme === "dark" ? "☀️" : "🌙";
      themeText.textContent = nextTheme === "dark" ? "Light" : "Dark";
    });

    // Load Question
    function loadQuestion(index) {
      const q = questionsData[index];
      const qNumFormatted = String(index + 1).padStart(2, '0');
      questionNumberTag.textContent = `Q. ${qNumFormatted} / 40`;
      questionPrompt.textContent = q.question;

      // Update progress
      const progressPercent = ((index) / questionsData.length) * 100;
      progressFill.style.width = `${progressPercent}%`;

      // Reset feedback and Next button
      feedbackBox.classList.remove("active");
      nextBtn.disabled = true;
      optionsContainer.innerHTML = "";

      const keys = ["(a)", "(b)", "(c)", "(d)"];

      q.options.forEach((optText, optIdx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `<span><span class="opt-key">${keys[optIdx]}</span> ${optText}</span>`;
        btn.addEventListener("click", () => handleSelectOption(optIdx));
        optionsContainer.appendChild(btn);
      });

      updateFooter();
    }

    // Handle Option Selection
    function handleSelectOption(selectedIndex) {
      const q = questionsData[currentQIndex];
      const allBtns = optionsContainer.querySelectorAll(".option-btn");

      // Disable all buttons immediately
      allBtns.forEach(btn => btn.disabled = true);

      const isCorrect = selectedIndex === q.correctIndex;
      if (isCorrect) {
        score++;
        allBtns[selectedIndex].classList.add("correct");
        feedbackHeader.className = "feedback-header success";
        feedbackHeader.innerHTML = "✓ Correct Answer";
      } else {
        allBtns[selectedIndex].classList.add("wrong");
        allBtns[q.correctIndex].classList.add("correct");
        feedbackHeader.className = "feedback-header fail";
        feedbackHeader.innerHTML = "✕ Incorrect Option Selected";
      }

      // Record for End Screen
      userAttempts.push({
        qNumber: currentQIndex + 1,
        questionText: q.question,
        selectedOption: q.options[selectedIndex],
        correctOption: q.options[q.correctIndex],
        isCorrect: isCorrect,
        tip: q.sscTip
      });

      // Show Feedback Box
      feedbackExplanation.textContent = q.explanation;
      feedbackTip.innerHTML = `<span class="ssc-tag">SSC Exam Trend</span> ${q.sscTip}`;
      feedbackBox.classList.add("active");

      // Enable Next
      nextBtn.disabled = false;
      updateFooter();
    }

    function updateFooter() {
      const remaining = questionsData.length - currentQIndex;
      scoreBadge.textContent = `Score: ${score} | Left: ${remaining}`;
    }

    // Next Question or Show Results
    nextBtn.addEventListener("click", () => {
      if (currentQIndex < questionsData.length - 1) {
        currentQIndex++;
        loadQuestion(currentQIndex);
      } else {
        showResults();
      }
    });

    // Show Results Screen
    function showResults() {
      progressFill.style.width = "100%";
      quizCard.style.display = "none";
      resultsScreen.style.display = "flex";

      const total = questionsData.length;
      const incorrectCount = total - score;
      const accuracyRate = Math.round((score / total) * 100);

      resultAccuracy.textContent = `${accuracyRate}%`;
      resultCorrect.textContent = score;
      resultIncorrect.textContent = incorrectCount;

      mistakesContainer.innerHTML = "";

      const mistakes = userAttempts.filter(a => !a.isCorrect);

      if (mistakes.length === 0) {
        mistakesContainer.innerHTML = `
          <div style="text-align: center; padding: 24px; color: var(--correct); font-weight: 700;">
            🏆 Outstanding Performance! You achieved 100% accuracy on all 40 SSC spelling questions!
          </div>`;
      } else {
        mistakes.forEach(item => {
          const div = document.createElement("div");
          div.className = "mistake-item";
          div.innerHTML = `
            <div class="mistake-q">Q.${item.qNumber}: ${item.questionText}</div>
            <div class="mistake-answers">
              <span class="user-ans">Your Answer: ${item.selectedOption}</span>
              <span class="correct-ans">Correct: ${item.correctOption}</span>
            </div>
            <div style="font-size: 0.7rem; color: var(--text-sub); margin-top: 3px;">
              <strong style="color: var(--accent);">SSC Note:</strong> ${item.tip}
            </div>
          `;
          mistakesContainer.appendChild(div);
        });
      }
    }

    // Restart Quiz
    restartBtn.addEventListener("click", () => {
      currentQIndex = 0;
      score = 0;
      userAttempts = [];
      resultsScreen.style.display = "none";
      quizCard.style.display = "flex";
      loadQuestion(0);
    });

    // Initialize Quiz
    loadQuestion(0);
  </script>
