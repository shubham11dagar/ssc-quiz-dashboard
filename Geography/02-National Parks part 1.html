<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSC National Parks & Wildlife Sanctuaries Master Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <style>
    :root[data-theme="dark"] {
      --bg-main: #0b0f19;
      --bg-card: #151c2c;
      --bg-card-hover: #1e293b;
      --bg-statement: rgba(30, 41, 59, 0.7);
      --border-color: #2a364f;
      --border-accent: #3b82f6;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-inverse: #0f172a;
      
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-glow: rgba(79, 70, 229, 0.35);
      
      --correct-bg: rgba(16, 185, 129, 0.15);
      --correct-border: #10b981;
      --correct-text: #34d399;
      
      --incorrect-bg: rgba(239, 68, 68, 0.15);
      --incorrect-border: #ef4444;
      --incorrect-text: #f87171;
      
      --badge-bg: rgba(99, 102, 241, 0.15);
      --badge-text: #818cf8;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    :root[data-theme="light"] {
      --bg-main: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-hover: #f8fafc;
      --bg-statement: #f8fafc;
      --border-color: #e2e8f0;
      --border-accent: #2563eb;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-inverse: #ffffff;
      
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-glow: rgba(79, 70, 229, 0.2);
      
      --correct-bg: #ecfdf5;
      --correct-border: #10b981;
      --correct-text: #047857;
      
      --incorrect-bg: #fef2f2;
      --incorrect-border: #ef4444;
      --incorrect-text: #b91c1c;
      
      --badge-bg: #e0e7ff;
      --badge-text: #3730a3;
      --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* APP HEADER */
    header {
      height: 56px;
      padding: 0 1.25rem;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 0.85rem;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.4);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .score-badge {
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.35rem 0.75rem;
      background: var(--badge-bg);
      color: var(--badge-text);
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .theme-toggle:hover {
      background: var(--bg-card-hover);
    }

    /* MAIN CONTAINER - NO SCROLL VIEWPORT FIT */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 0.75rem 1rem;
      height: calc(100vh - 56px);
      height: calc(100dvh - 56px);
      justify-content: space-between;
      overflow: hidden;
    }

    /* PROGRESS BAR */
    .progress-container {
      margin-bottom: 0.6rem;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }

    .progress-bar-bg {
      height: 6px;
      width: 100%;
      background: var(--border-color);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4f46e5, #06b6d4);
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    /* QUESTION CARD */
    .quiz-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.1rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      flex: 1;
      max-height: calc(100vh - 145px);
      max-height: calc(100dvh - 145px);
      overflow-y: auto;
    }

    .question-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .tag {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.25rem 0.6rem;
      background: var(--badge-bg);
      color: var(--badge-text);
      border-radius: 6px;
    }

    .key-hint {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .question-text {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text-main);
    }

    /* COMPLEX TYPE STYLING: STATEMENT CALLOUT BOX */
    .statements-box {
      background: var(--bg-statement);
      border-left: 3px solid var(--border-accent);
      border-radius: 8px;
      padding: 0.75rem 0.9rem;
      margin: 0.25rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .statement-item {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      font-size: 0.88rem;
      line-height: 1.35;
      color: var(--text-main);
    }

    .statement-num {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: var(--border-accent);
      background: rgba(59, 130, 246, 0.12);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-size: 0.78rem;
      flex-shrink: 0;
    }

    /* OPTIONS CONTAINER */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.5rem;
      margin-top: 0.25rem;
    }

    @media (min-height: 700px) and (min-width: 640px) {
      .options-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .option-btn {
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      padding: 0.65rem 0.85rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-main);
      position: relative;
      user-select: none;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--bg-card-hover);
      transform: translateY(-1px);
    }

    .option-key {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .option-btn:hover:not(:disabled) .option-key {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* OPTION STATES */
    .option-btn.correct {
      background: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-text) !important;
      font-weight: 700;
    }

    .option-btn.correct .option-key {
      background: var(--correct-border);
      color: white;
      border-color: var(--correct-border);
    }

    .option-btn.incorrect {
      background: var(--incorrect-bg) !important;
      border-color: var(--incorrect-border) !important;
      color: var(--incorrect-text) !important;
      font-weight: 600;
    }

    .option-btn.incorrect .option-key {
      background: var(--incorrect-border);
      color: white;
      border-color: var(--incorrect-border);
    }

    .option-btn:disabled {
      cursor: default;
      opacity: 0.85;
    }

    /* EXPLANATION BOX */
    .explanation-box {
      display: none;
      background: var(--bg-statement);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      padding: 0.75rem 0.9rem;
      font-size: 0.83rem;
      line-height: 1.4;
      color: var(--text-main);
      animation: fadeIn 0.25s ease-in-out;
    }

    .explanation-title {
      font-weight: 700;
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--primary);
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
    }

    /* BOTTOM ACTION BAR */
    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.5rem;
    }

    .next-btn {
      background: linear-gradient(135deg, var(--primary), #3b82f6);
      color: white;
      border: none;
      padding: 0.65rem 1.4rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 14px var(--primary-glow);
      margin-left: auto;
    }

    .next-btn:hover:not(:disabled) {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .next-btn:disabled {
      background: var(--border-color);
      color: var(--text-muted);
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* RESULTS SCREEN */
    .results-screen {
      display: none;
      flex-direction: column;
      height: 100%;
      overflow-y: auto;
      gap: 1rem;
      padding-right: 0.2rem;
    }

    .results-header-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.25rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .score-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: conic-gradient(var(--primary) calc(var(--score-percent) * 1%), var(--border-color) 0);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin: 0.25rem 0;
    }

    .score-circle-inner {
      width: 82px;
      height: 82px;
      background: var(--bg-card);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .score-val {
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1;
    }

    .score-pct {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stats-row {
      display: flex;
      gap: 1rem;
      width: 100%;
      max-width: 400px;
    }

    .stat-box {
      flex: 1;
      padding: 0.6rem;
      background: var(--bg-statement);
      border-radius: 10px;
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: 800;
      margin-top: 0.1rem;
    }

    .breakdown-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .breakdown-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding-bottom: 1rem;
    }

    .review-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.85rem;
    }

    .review-item.is-incorrect {
      border-left: 4px solid var(--incorrect-border);
    }

    .review-item.is-correct {
      border-left: 4px solid var(--correct-border);
    }

    .review-q-title {
      font-weight: 700;
      color: var(--text-main);
    }

    .review-answers {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.8rem;
    }

    .review-ans {
      padding: 0.3rem 0.5rem;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .review-ans.user-wrong {
      background: var(--incorrect-bg);
      color: var(--incorrect-text);
      font-weight: 600;
    }

    .review-ans.right-ans {
      background: var(--correct-bg);
      color: var(--correct-text);
      font-weight: 600;
    }

    .restart-btn {
      background: linear-gradient(135deg, var(--primary), #3b82f6);
      color: white;
      border: none;
      padding: 0.75rem 1.75rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* UTILITY SCROLLBAR */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- APP HEADER -->
  <header>
    <div class="brand">
      <div class="brand-icon">SSC</div>
      <span>Geography Master Quiz</span>
    </div>
    <div class="header-actions">
      <div class="score-badge" id="headerScore">
        <span>Score:</span> <strong id="scoreCount">0</strong>
      </div>
      <button class="theme-toggle" id="themeToggleBtn" title="Toggle Light/Dark Theme">
        <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- MAIN VIEWPORT CONTENT -->
  <main>
    <!-- QUIZ INTERFACE VIEW -->
    <div id="quizView" style="display: flex; flex-direction: column; height: 100%; justify-content: space-between;">
      
      <!-- PROGRESS INDICATOR -->
      <div class="progress-container">
        <div class="progress-info">
          <span id="questionCounter">Question 1 of 13</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
      </div>

      <!-- MAIN QUESTION CARD -->
      <div class="quiz-card" id="quizCard">
        <div class="question-header">
          <span class="tag" id="questionTag">LADAKH & JK</span>
          <span class="key-hint">Press A, B, C, or D</span>
        </div>

        <div class="question-text" id="questionText">
          Question text loading...
        </div>

        <!-- OPTIONAL STATEMENTS BLOCK FOR COMPLEX QUESTIONS -->
        <div class="statements-box" id="statementsBox" style="display: none;"></div>

        <!-- OPTIONS -->
        <div class="options-grid" id="optionsGrid"></div>

        <!-- EXPLANATION BOX -->
        <div class="explanation-box" id="explanationBox">
          <div class="explanation-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            Explanation & Key Note
          </div>
          <div id="explanationText"></div>
        </div>
      </div>

      <!-- BOTTOM ACTION BAR -->
      <div class="action-bar">
        <button class="next-btn" id="nextBtn" disabled>
          <span>Next Question</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>

    <!-- RESULTS SCREEN VIEW -->
    <div class="results-screen" id="resultsView">
      <div class="results-header-card">
        <h2 style="font-size: 1.25rem; font-weight: 800;">Quiz Completed!</h2>
        <div class="score-circle" id="scoreCircle" style="--score-percent: 0;">
          <div class="score-circle-inner">
            <div class="score-val" id="finalScoreVal">0/13</div>
            <div class="score-pct" id="finalPctVal">0%</div>
          </div>
        </div>
        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-label">Correct</div>
            <div class="stat-value" style="color: var(--correct-border);" id="statCorrect">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Incorrect</div>
            <div class="stat-value" style="color: var(--incorrect-border);" id="statIncorrect">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Accuracy</div>
            <div class="stat-value" id="statAccuracy">0%</div>
          </div>
        </div>
        <button class="restart-btn" id="restartBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          Restart Quiz
        </button>
      </div>

      <div class="breakdown-title">
        <span>Question Performance Review</span>
        <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 500;" id="breakdownFilterLabel">Showing all questions</span>
      </div>

      <div class="breakdown-list" id="breakdownList"></div>
    </div>
  </main>

  <script>
    // QUESTION DATASET STRUCTURED DIRECTLY FROM USER INPUT
    const quizData = [
      {
        id: 1,
        tag: "UT of Ladakh",
        question: "Which of the following National Parks and Wildlife Sanctuaries are located in the Union Territory of Ladakh as per the map?",
        options: [
          "(A) Hemis NP and Karakoram (Nubra Shyok) WLS",
          "(B) Dachigam NP and Salim Ali NP",
          "(C) Kishtwar NP and Surinsar WLS",
          "(D) Inderkilla NP and Pin Valley NP"
        ],
        answer: 0,
        explanation: "Under Ladakh, the map explicitly lists Hemis NP and Karakoram (Nubra Shyok) WLS."
      },
      {
        id: 2,
        tag: "Jammu & Kashmir Mnemonics",
        question: "What is the mnemonic trick given in the text to remember the National Parks of Jammu & Kashmir?",
        options: [
          "(A) Inder Him पे Khir खा रहा था और Pin से Sim निकल रहा था",
          "(B) Salim ने Do Gram Kish दी Kazi ko",
          "(C) Rajaji Flowers लेके Jimmy Devi से मिलने पहुंचे Pashu Vihar me",
          "(D) Nawabganj से Dudhwa गया Valmiki"
        ],
        answer: 1,
        explanation: "Trick Breakdown:\nSalim → Salim Ali NP\nDo Gram → Dachigam NP\nKish → Kishtwar NP\nKazi ko → Kazinag NP"
      },
      {
        id: 3,
        tag: "J&K Wetlands & Ramsar",
        question: "Which of the following Ramsar Sites / Wetland / Wildlife Sanctuary is located in Jammu and Kashmir according to the provided material?",
        options: [
          "(A) Renuka Lake",
          "(B) Kanwar Taal",
          "(C) Hokersar or Hokera RS",
          "(D) Nagi WLS"
        ],
        answer: 2,
        explanation: "The J&K map marks Hokersar or Hokera RS and Surinsar WLS along with Kazinag, Dachigam, Kishtwar, and Salim Ali National Parks."
      },
      {
        id: 4,
        tag: "Fauna of Kashmir",
        question: "Which animals are specifically mentioned in the notes as being found in Kashmir?",
        options: [

    // STATE VARIABLES
    let currentIdx = 0;
    let score = 0;
    let userAnswers = new Array(quizData.length).fill(null);

    // DOM ELEMENTS
    const quizView = document.getElementById('quizView');
    const resultsView = document.getElementById('resultsView');
    const questionCounter = document.getElementById('questionCounter');
    const progressPct = document.getElementById('progressPct');
    const progressBar = document.getElementById('progressBar');
    const scoreCount = document.getElementById('scoreCount');
    const questionTag = document.getElementById('questionTag');
    const questionText = document.getElementById('questionText');
    const statementsBox = document.getElementById('statementsBox');
    const optionsGrid = document.getElementById('optionsGrid');
    const explanationBox = document.getElementById('explanationBox');
    const explanationText = document.getElementById('explanationText');
    const nextBtn = document.getElementById('nextBtn');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');

    // INITIALIZATION
    function initQuiz() {
      currentIdx = 0;
      score = 0;
      userAnswers.fill(null);
      scoreCount.textContent = '0';
      quizView.style.display = 'flex';
      resultsView.style.display = 'none';
      loadQuestion();
    }

    // LOAD QUESTION FUNCTION
    function loadQuestion() {
      const q = quizData[currentIdx];
      
      // Update Progress
      const pct = Math.round(((currentIdx) / quizData.length) * 100);
      questionCounter.textContent = `Question ${currentIdx + 1} of ${quizData.length}`;
      progressPct.textContent = `${pct}%`;
      progressBar.style.width = `${pct}%`;

      // Question metadata
      questionTag.textContent = q.tag;
      
      if (q.statements && q.statements.length > 0) {
        questionText.textContent = q.question;
        statementsBox.style.display = 'flex';
        statementsBox.innerHTML = '';
        q.statements.forEach((stmt, i) => {
          const item = document.createElement('div');
          item.className = 'statement-item';
          item.innerHTML = `<span class="statement-num">${i + 1}</span> <span>${stmt}</span>`;
          statementsBox.appendChild(item);
        });
        if (q.subQuestion) {
          const subq = document.createElement('div');
          subq.style.fontWeight = '700';
          subq.style.marginTop = '0.3rem';
          subq.textContent = q.subQuestion;
          statementsBox.appendChild(subq);
        }
      } else {
        questionText.textContent = q.question;
        statementsBox.style.display = 'none';
      }

      // Render Options
      optionsGrid.innerHTML = '';
      explanationBox.style.display = 'none';
      nextBtn.disabled = true;

      const letters = ['A', 'B', 'C', 'D'];
      q.options.forEach((optText, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        
        // Strip out leading (A), (B) if present for clean display alongside badge
        const cleanText = optText.replace(/^\([A-D]\)\s*/, '');

        btn.innerHTML = `
          <div class="option-key">${letters[i]}</div>
          <span>${cleanText}</span>
        `;

        btn.addEventListener('click', () => selectOption(i));
        optionsGrid.appendChild(btn);
      });

      // Update button text on last question
      if (currentIdx === quizData.length - 1) {
        nextBtn.querySelector('span').textContent = 'Finish Quiz';
      } else {
        nextBtn.querySelector('span').textContent = 'Next Question';
      }
    }

    // OPTION SELECTION LOGIC
    function selectOption(selectedIndex) {
      const q = quizData[currentIdx];
      const optionButtons = optionsGrid.querySelectorAll('.option-btn');

      userAnswers[currentIdx] = selectedIndex;

      // Disable all buttons
      optionButtons.forEach(btn => btn.disabled = true);

      if (selectedIndex === q.answer) {
        score++;
        scoreCount.textContent = score;
        optionButtons[selectedIndex].classList.add('correct');
      } else {
        optionButtons[selectedIndex].classList.add('incorrect');
        optionButtons[q.answer].classList.add('correct');
      }

      // Format explanation lines
      explanationText.innerHTML = q.explanation.replace(/\n/g, '<br>');
      explanationBox.style.display = 'block';

      nextBtn.disabled = false;
    }

    // NEXT QUESTION HANDLER
    nextBtn.addEventListener('click', () => {
      if (currentIdx < quizData.length - 1) {
        currentIdx++;
        loadQuestion();
      } else {
        showResults();
      }
    });

    // RESULTS SUMMARY DISPLAY
    function showResults() {
      quizView.style.display = 'none';
      resultsView.style.display = 'flex';

      const total = quizData.length;
      const pct = Math.round((score / total) * 100);

      document.getElementById('finalScoreVal').textContent = `${score}/${total}`;
      document.getElementById('finalPctVal').textContent = `${pct}%`;
      document.getElementById('scoreCircle').style.setProperty('--score-percent', pct);

      document.getElementById('statCorrect').textContent = score;
      document.getElementById('statIncorrect').textContent = total - score;
      document.getElementById('statAccuracy').textContent = `${pct}%`;

      // Breakdown List Rendering
      const breakdownList = document.getElementById('breakdownList');
      breakdownList.innerHTML = '';

      quizData.forEach((q, idx) => {
        const userChoice = userAnswers[idx];
        const isCorrect = userChoice === q.answer;

        const item = document.createElement('div');
        item.className = `review-item ${isCorrect ? 'is-correct' : 'is-incorrect'}`;

        let statementsHtml = '';
        if (q.statements) {
          statementsHtml = `<div class="statements-box" style="margin: 0.3rem 0; padding: 0.5rem;">
            ${q.statements.map((s, i) => `<div class="statement-item" style="font-size:0.8rem;"><span class="statement-num">${i+1}</span><span>${s}</span></div>`).join('')}
          </div>`;
        }

        const letters = ['A', 'B', 'C', 'D'];
        const userAnsText = userChoice !== null ? q.options[userChoice] : 'Not Answered';
        const rightAnsText = q.options[q.answer];

        item.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="tag" style="font-size:0.65rem;">Q${idx + 1} • ${q.tag}</span>
            <span style="font-weight:700; font-size:0.75rem; color:${isCorrect ? 'var(--correct-text)' : 'var(--incorrect-text)'}">
              ${isCorrect ? '✓ Correct' : '✕ Incorrect'}
            </span>
          </div>
          <div class="review-q-title">${q.question}</div>
          ${statementsHtml}
          <div class="review-answers">
            ${!isCorrect ? `<div class="review-ans user-wrong">Your Answer: ${userAnsText}</div>` : ''}
            <div class="review-ans right-ans">Correct Answer: ${rightAnsText}</div>
          </div>
          <div style="font-size:0.78rem; color:var(--text-muted); margin-top:0.2rem; background:var(--bg-statement); padding:0.4rem 0.6rem; border-radius:6px;">
            <strong>Note:</strong> ${q.explanation.replace(/\n/g, ' ')}
          </div>
        `;

        breakdownList.appendChild(item);
      });
    }

    // RESTART QUIZ
    document.getElementById('restartBtn').addEventListener('click', initQuiz);

    // THEME TOGGLE LOGIC
    let isDark = true;
    themeToggleBtn.addEventListener('click', () => {
      isDark = !isDark;
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      
      if (isDark) {
        themeIcon.innerHTML = `
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        `;
      } else {
        themeIcon.innerHTML = `
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        `;
      }
    });

    // KEYBOARD NAVIGATION
    document.addEventListener('keydown', (e) => {
      if (quizView.style.display === 'none') return;

      const key = e.key.toUpperCase();
      if (['A', 'B', 'C', 'D'].includes(key)) {
        const indexMap = { 'A': 0, 'B': 1, 'C': 2, 'D': 3 };
        const targetBtn = optionsGrid.children[indexMap[key]];
        if (targetBtn && !targetBtn.disabled) {
          selectOption(indexMap[key]);
        }
      } else if (e.key === 'Enter' || e.key === ' ') {
        if (!nextBtn.disabled) {
          nextBtn.click();
        }
      }
    });

    // RUN ON LOAD
    initQuiz();
  </script>
</body>
