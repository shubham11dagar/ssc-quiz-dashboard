        // Dark / Light Mode Toggle
        function initTheme() {
            if (localStorage.getItem('quiz_theme') === 'light') {
                document.documentElement.classList.remove('dark');
                themeIcon.className = 'fa-solid fa-sun';
            } else {
                document.documentElement.classList.add('dark');
                themeIcon.className = 'fa-solid fa-moon';
            }
        }

        themeToggleBtn.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('quiz_theme', 'light');
                themeIcon.className = 'fa-solid fa-sun';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('quiz_theme', 'dark');
                themeIcon.className = 'fa-solid fa-moon';
            }
        });

        // Render Question Function
        function renderQuestion() {
            const q = quizData[currentIdx];

            headerTotalQ.innerText = quizData.length;
            qNumberBadge.innerText = `${currentIdx + 1} of ${quizData.length}`;
            
            // Update progress bar width
            const progressPercent = ((currentIdx + 1) / quizData.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            // Calculate current live score
            const scoreCount = userAnswers.reduce((acc, val, idx) => {
                return val === quizData[idx].answer ? acc + 1 : acc;
            }, 0);
            headerScore.innerText = scoreCount;

            // Update question text
            questionTitle.innerText = q.question;

            // Reset Options
            optionsContainer.innerHTML = '';
            const answeredIndex = userAnswers[currentIdx];
            const isAnswered = answeredIndex !== null;

            q.options.forEach((optText, optIdx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-2.5 sm:p-3 rounded-xl border font-medium text-xs sm:text-sm flex items-center space-x-2.5 sm:space-x-3 text-gray-800 dark:text-gray-200 bg-gray-50 dark:bg-gray-800/60 border-gray-200 dark:border-gray-700/80 hover:bg-gray-100 dark:hover:bg-gray-800 focus:outline-none`;

                // Add key badge icon
                const badge = document.createElement('span');
                badge.className = `w-6 h-6 sm:w-7 sm:h-7 rounded-lg text-xs font-bold flex items-center justify-center shrink-0 bg-white dark:bg-gray-700 text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-600`;
                badge.innerText = optionPrefixes[optIdx];

                const label = document.createElement('span');
                label.className = 'flex-1 leading-tight';
                label.innerText = optText;

                btn.appendChild(badge);
                btn.appendChild(label);

                if (isAnswered) {
                    btn.disabled = true;
                    if (optIdx === q.answer) {
                        // Correct Option Style
                        btn.className = `option-btn w-full text-left p-2.5 sm:p-3 rounded-xl border font-medium text-xs sm:text-sm flex items-center space-x-2.5 sm:space-x-3 text-emerald-900 dark:text-emerald-100 bg-emerald-100/80 dark:bg-emerald-950/70 border-emerald-400 dark:border-emerald-600`;
                        badge.className = `w-6 h-6 sm:w-7 sm:h-7 rounded-lg text-xs font-bold flex items-center justify-center shrink-0 bg-emerald-600 text-white`;
                        badge.innerHTML = `<i class="fa-solid fa-check"></i>`;
                    } else if (optIdx === answeredIndex) {
                        // User Wrong Selection Style
                        btn.className = `option-btn w-full text-left p-2.5 sm:p-3 rounded-xl border font-medium text-xs sm:text-sm flex items-center space-x-2.5 sm:space-x-3 text-rose-900 dark:text-rose-100 bg-rose-100/80 dark:bg-rose-950/70 border-rose-400 dark:border-rose-600`;
                        badge.className = `w-6 h-6 sm:w-7 sm:h-7 rounded-lg text-xs font-bold flex items-center justify-center shrink-0 bg-rose-600 text-white`;
                        badge.innerHTML = `<i class="fa-solid fa-xmark"></i>`;
                    } else {
                        btn.classList.add('opacity-50');
                    }
                } else {
                    btn.onclick = () => selectOption(optIdx);
                }

                optionsContainer.appendChild(btn);
            });

            // Explanation Display
            if (isAnswered) {
                explanationBox.classList.remove('hidden');
                const isCorrect = answeredIndex === q.answer;
                if (isCorrect) {
                    explanationBox.className = "mt-2 p-2.5 sm:p-3 rounded-xl border text-xs sm:text-sm flex-1 overflow-y-auto custom-scrollbar max-h-[22vh] sm:max-h-[20vh] transition-all bg-emerald-50 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-800 text-emerald-900 dark:text-emerald-200";
                    explanationIcon.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600 dark:text-emerald-400"></i>`;
                    explanationStatus.innerText = "Correct Answer!";
                    explanationStatus.className = "font-bold block mb-0.5 text-emerald-700 dark:text-emerald-300";
                } else {
                    explanationBox.className = "mt-2 p-2.5 sm:p-3 rounded-xl border text-xs sm:text-sm flex-1 overflow-y-auto custom-scrollbar max-h-[22vh] sm:max-h-[20vh] transition-all bg-rose-50 dark:bg-rose-950/40 border-rose-200 dark:border-rose-800 text-rose-900 dark:text-rose-200";
                    explanationIcon.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-600 dark:text-rose-400"></i>`;
                    explanationStatus.innerText = "Incorrect Answer!";
                    explanationStatus.className = "font-bold block mb-0.5 text-rose-700 dark:text-rose-300";
                }
                explanationText.innerText = q.explanation;
            } else {
                explanationBox.classList.add('hidden');
            }

            // Update Prev / Next Buttons
            prevBtn.disabled = currentIdx === 0;
            if (currentIdx === quizData.length - 1) {
                nextBtnText.innerText = "Finish Quiz";
            } else {
                nextBtnText.innerText = "Next Question";
            }
        }

        // Handle Option Selection
        function selectOption(index) {
            if (userAnswers[currentIdx] !== null) return;
            userAnswers[currentIdx] = index;
            renderQuestion();
        }

        // Handle Question Navigation
        function navigateQuestion(step) {
            const nextIndex = currentIdx + step;
            if (nextIndex >= 0 && nextIndex < quizData.length) {
                currentIdx = nextIndex;
                renderQuestion();
            } else if (nextIndex >= quizData.length) {
                showResults();
            }
        }

        function skipQuestion() {
            navigateQuestion(1);
        }

        // Display Final Results Summary
        function showResults() {
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            resultsScreen.classList.add('flex');

            let correct = 0;
            let incorrect = 0;
            const incorrectListContainer = document.getElementById('incorrectListContainer');
            incorrectListContainer.innerHTML = '';

            quizData.forEach((q, idx) => {
                const uAns = userAnswers[idx];
                if (uAns === q.answer) {
                    correct++;
                } else {
                    incorrect++;
                    // Render Breakdown Card for Incorrect/Unanswered Questions
                    const card = document.createElement('div');
                    card.className = "p-3 rounded-xl bg-gray-50 dark:bg-gray-800/70 border border-gray-200 dark:border-gray-700 text-xs sm:text-sm";
                    
                    const uAnsText = uAns !== null ? `${optionPrefixes[uAns]}) ${q.options[uAns]}` : "Not Answered (Skipped)";
                    const cAnsText = `${optionPrefixes[q.answer]}) ${q.options[q.answer]}`;

                    card.innerHTML = `
                        <div class="font-bold text-gray-900 dark:text-gray-100 mb-1.5 flex items-start gap-1.5">
                            <span class="text-blue-600 dark:text-blue-400 shrink-0">Q${idx + 1}.</span>
                            <span>${q.question}</span>
                        </div>
                        <div class="space-y-1 pl-4 border-l-2 border-rose-400 dark:border-rose-600 my-1">
                            <div class="text-rose-600 dark:text-rose-400 font-medium">
                                <span class="font-semibold">Your Answer:</span> ${uAnsText}
                            </div>
                            <div class="text-emerald-600 dark:text-emerald-400 font-medium">
                                <span class="font-semibold">Correct Answer:</span> ${cAnsText}
                            </div>
                        </div>
                        <div class="mt-1.5 text-gray-500 dark:text-gray-400 text-xs bg-white dark:bg-gray-900/50 p-2 rounded-lg border border-gray-100 dark:border-gray-800">
                            <span class="font-semibold text-gray-700 dark:text-gray-300">Explanation:</span> ${q.explanation}
                        </div>
                    `;
                    incorrectListContainer.appendChild(card);
                }
            });

            // Calculate percentage
            const percentage = Math.round((correct / quizData.length) * 100);

            document.getElementById('resScore').innerText = correct;
            document.getElementById('resPercentage').innerText = `${percentage}%`;
            document.getElementById('resIncorrect').innerText = incorrect;
            document.getElementById('incorrectBadge').innerText = `${incorrect} Incorrect / Skipped`;

            if (incorrect === 0) {
                incorrectListContainer.innerHTML = `
                    <div class="text-center py-8 text-emerald-600 dark:text-emerald-400 font-bold">
                        <i class="fa-solid fa-circle-check text-4xl mb-2"></i>
                        <p>Perfect Score! You answered all questions correctly.</p>
                    </div>
                `;
            }
        }

        // Restart Quiz
        function restartQuiz() {
            currentIdx = 0;
            userAnswers = new Array(quizData.length).fill(null);
            resultsScreen.classList.add('hidden');
            resultsScreen.classList.remove('flex');
            quizScreen.classList.remove('hidden');
            renderQuestion();
        }

        // Keyboard Shortcuts (1-4 or A-D, Left/Right arrow)
        document.addEventListener('keydown', (e) => {
            if (resultsScreen.classList.contains('hidden')) {
                if (e.key === 'ArrowRight') {
                    navigateQuestion(1);
                } else if (e.key === 'ArrowLeft') {
                    navigateQuestion(-1);
                } else if (['1', '2', '3', '4'].includes(e.key)) {
                    selectOption(parseInt(e.key) - 1);
                } else if (['a', 'b', 'c', 'd'].includes(e.key.toLowerCase())) {
                    const map = { 'a': 0, 'b': 1, 'c': 2, 'd': 3 };
                    selectOption(map[e.key.toLowerCase()]);
                }
            }
        });

        // Initialize App on DOM Load
        window.onload = function () {
            initTheme();
            renderQuestion();
        };
    </script>
</body>
</html>
