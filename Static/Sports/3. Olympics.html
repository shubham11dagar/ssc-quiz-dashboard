      constructor() {
        this.questions = rawQuestionsData;
        this.currentIndex = 0;
        this.score = 0;
        this.userAnswers = new Array(this.questions.length).fill(null);
        this.secondsElapsed = 0;
        this.timerInterval = null;

        this.initDOMElements();
        this.setupTheme();
        this.bindEvents();
        this.startTimer();
        this.renderQuestion();
      }

      initDOMElements() {
        this.dom = {
          quizScreen: document.getElementById('quiz-screen'),
          resultsScreen: document.getElementById('results-screen'),
          progressBar: document.getElementById('progress-bar'),
          questionBadge: document.getElementById('question-badge'),
          questionCount: document.getElementById('question-count'),
          questionText: document.getElementById('question-text'),
          complexContent: document.getElementById('complex-content'),
          optionsContainer: document.getElementById('options-container'),
          explanationBox: document.getElementById('explanation-box'),
          explanationTitle: document.getElementById('explanation-title'),
          explanationText: document.getElementById('explanation-text'),
          explanationIcon: document.getElementById('explanation-icon'),
          nextBtn: document.getElementById('next-btn'),
          headerScore: document.getElementById('header-score'),
          headerTimer: document.getElementById('header-timer'),
          themeToggle: document.getElementById('theme-toggle'),
          // Result screen elements
          resultPercentage: document.getElementById('result-percentage'),
          resultCircle: document.getElementById('result-circle'),
          resultScoreText: document.getElementById('result-score-text'),
          resultStatus: document.getElementById('result-status'),
          resCorrect: document.getElementById('res-correct'),
          resIncorrect: document.getElementById('res-incorrect'),
          resTime: document.getElementById('res-time'),
          reviewList: document.getElementById('review-list')
        };
      }

      setupTheme() {
        const savedTheme = localStorage.getItem('ssc_quiz_theme');
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      }

      toggleTheme() {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('ssc_quiz_theme', isDark ? 'dark' : 'light');
      }

      startTimer() {
        this.timerInterval = setInterval(() => {
          this.secondsElapsed++;
          const mins = String(Math.floor(this.secondsElapsed / 60)).padStart(2, '0');
          const secs = String(this.secondsElapsed % 60).padStart(2, '0');
          this.dom.headerTimer.textContent = `${mins}:${secs}`;
        }, 1000);
      }

      renderQuestion() {
        const q = this.questions[this.currentIndex];
        const isAnswered = this.userAnswers[this.currentIndex] !== null;

        // Progress & Badges
        const progressPct = ((this.currentIndex + 1) / this.questions.length) * 100;
        this.dom.progressBar.style.width = `${progressPct}%`;
        
        this.dom.questionBadge.textContent = q.type === 'match' ? 'Match The Following' : `Question ${q.id}`;
        this.dom.questionCount.textContent = `${this.currentIndex + 1} / ${this.questions.length}`;
        this.dom.questionText.textContent = q.question;

        // Render Special Complex Format Content if required
        this.renderComplexFormat(q);

        // Render Options Grid
        this.dom.optionsContainer.innerHTML = '';
        const optionPrefixes = ['A', 'B', 'C', 'D'];

        q.options.forEach((optText, idx) => {
          const btn = document.createElement('button');
          btn.className = `option-card relative text-left p-3 sm:p-3.5 rounded-xl border font-medium text-xs sm:text-sm flex items-center justify-between gap-3 w-full transition-all ${
            isAnswered ? 'disabled cursor-default' : 'hover:border-blue-500 hover:bg-blue-50/50 dark:hover:bg-blue-950/30'
          }`;

          // Default option border/bg styles
          btn.classList.add('bg-slate-50', 'dark:bg-slate-800/60', 'border-slate-200', 'dark:border-slate-700/80', 'text-slate-800', 'dark:text-slate-200');

          // Styling answered state
          if (isAnswered) {
            const selectedIdx = this.userAnswers[this.currentIndex];
            if (idx === q.answerIndex) {
              // Correct option highlight
              btn.className = 'option-card text-left p-3 sm:p-3.5 rounded-xl border font-semibold text-xs sm:text-sm flex items-center justify-between gap-3 w-full bg-emerald-50 dark:bg-emerald-950/60 border-emerald-500 text-emerald-800 dark:text-emerald-200 shadow-sm';
            } else if (idx === selectedIdx && selectedIdx !== q.answerIndex) {
              // Incorrect choice highlight
              btn.className = 'option-card text-left p-3 sm:p-3.5 rounded-xl border font-semibold text-xs sm:text-sm flex items-center justify-between gap-3 w-full bg-rose-50 dark:bg-rose-950/60 border-rose-500 text-rose-800 dark:text-rose-200 shadow-sm';
            } else {
              btn.classList.add('opacity-50');
            }
          }

          // Option Letter Badge & Text
          let badgeColorClass = "bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300";
          if (isAnswered) {
            if (idx === q.answerIndex) badgeColorClass = "bg-emerald-600 text-white";
            else if (idx === this.userAnswers[this.currentIndex]) badgeColorClass = "bg-rose-600 text-white";
          }

          btn.innerHTML = `
            <div class="flex items-center gap-2.5">
              <span class="w-6 h-6 rounded-lg flex items-center justify-center font-bold text-xs flex-none ${badgeColorClass}">
                ${optionPrefixes[idx]}
              </span>
              <span class="leading-snug">${optText}</span>
            </div>
            ${isAnswered && idx === q.answerIndex ? '<i class="fa-solid fa-circle-check text-emerald-600 dark:text-emerald-400 text-base"></i>' : ''}
            ${isAnswered && idx === this.userAnswers[this.currentIndex] && idx !== q.answerIndex ? '<i class="fa-solid fa-circle-xmark text-rose-600 dark:text-rose-400 text-base"></i>' : ''}
          `;

          if (!isAnswered) {
            btn.onclick = () => this.selectOption(idx);
          }

          this.dom.optionsContainer.appendChild(btn);
        });

        // Explanation Box & Next Button updates
        if (isAnswered) {
          const isCorrect = this.userAnswers[this.currentIndex] === q.answerIndex;
          this.dom.explanationBox.classList.remove('hidden');
          this.dom.explanationBox.className = `mt-3 p-3 sm:p-3.5 rounded-xl border text-xs sm:text-sm fade-in ${
            isCorrect 
              ? 'bg-emerald-50/80 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-900/60 text-emerald-900 dark:text-emerald-200' 
              : 'bg-rose-50/80 dark:bg-rose-950/40 border-rose-200 dark:border-rose-900/60 text-rose-900 dark:text-rose-200'
          }`;
          
          this.dom.explanationIcon.innerHTML = isCorrect 
            ? '<i class="fa-solid fa-lightbulb text-emerald-600 dark:text-emerald-400"></i>' 
            : '<i class="fa-solid fa-circle-info text-rose-600 dark:text-rose-400"></i>';
          
          this.dom.explanationTitle.textContent = isCorrect ? 'Correct Answer!' : `Incorrect - Correct Choice: ${optionPrefixes[q.answerIndex]}`;
          this.dom.explanationText.textContent = q.explanation;

          this.dom.nextBtn.disabled = false;
        } else {
          this.dom.explanationBox.classList.add('hidden');
          this.dom.nextBtn.disabled = true;
        }

        // Change button label on last question
        if (this.currentIndex === this.questions.length - 1) {
          this.dom.nextBtn.querySelector('span').textContent = 'View Results';
        } else {
          this.dom.nextBtn.querySelector('span').textContent = 'Next Question';
        }
      }

      renderComplexFormat(q) {
        if (q.type === 'match' && q.matchData) {
          this.dom.complexContent.classList.remove('hidden');
          const m = q.matchData;
          this.dom.complexContent.innerHTML = `
            <div class="bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/80 rounded-xl p-2.5 sm:p-3 text-xs">
              <div class="grid grid-cols-2 gap-3 font-semibold border-b border-slate-200 dark:border-slate-700 pb-1.5 mb-2 text-slate-700 dark:text-slate-300">
                <div class="text-blue-600 dark:text-blue-400 font-bold">${m.col1Title}</div>
                <div class="text-blue-600 dark:text-blue-400 font-bold">${m.col2Title}</div>
              </div>
              <div class="grid grid-cols-2 gap-3 text-slate-600 dark:text-slate-300">
                <div class="space-y-1">
                  ${m.col1.map(item => `<div class="p-1 rounded bg-white dark:bg-slate-900/50 border border-slate-200/60 dark:border-slate-700/50">${item}</div>`).join('')}
                </div>
                <div class="space-y-1">
                  ${m.col2.map(item => `<div class="p-1 rounded bg-white dark:bg-slate-900/50 border border-slate-200/60 dark:border-slate-700/50">${item}</div>`).join('')}
                </div>
              </div>
            </div>
          `;
        } else {
          this.dom.complexContent.classList.add('hidden');
          this.dom.complexContent.innerHTML = '';
        }
      }

      selectOption(index) {
        if (this.userAnswers[this.currentIndex] !== null) return;

        this.userAnswers[this.currentIndex] = index;
        const q = this.questions[this.currentIndex];

        if (index === q.answerIndex) {
          this.score++;
          this.dom.headerScore.textContent = this.score;
        }

        this.renderQuestion();
      }

      nextQuestion() {
        if (this.currentIndex < this.questions.length - 1) {
          this.currentIndex++;
          this.renderQuestion();
        } else {
          this.showResults();
        }
      }

      showResults() {
        clearInterval(this.timerInterval);
        this.dom.quizScreen.classList.add('hidden');
        this.dom.resultsScreen.classList.remove('hidden');

        const total = this.questions.length;
        const percentage = Math.round((this.score / total) * 100);
        const incorrectCount = total - this.score;

        // Circular gauge animation
        this.dom.resultCircle.setAttribute('stroke-dasharray', `${percentage}, 100`);
        this.dom.resultPercentage.textContent = `${percentage}%`;
        this.dom.resultScoreText.textContent = `${this.score} / ${total}`;

        this.dom.resCorrect.textContent = this.score;
        this.dom.resIncorrect.textContent = incorrectCount;
        this.dom.resTime.textContent = this.dom.headerTimer.textContent;

        if (percentage >= 80) {
          this.dom.resultStatus.textContent = "Excellent Performance! 🏆";
        } else if (percentage >= 50) {
          this.dom.resultStatus.textContent = "Good Effort! Keep Reviewing 📖";
        } else {
          this.dom.resultStatus.textContent = "Needs Revision 💡";
        }

        // Render Breakdown List
        this.dom.reviewList.innerHTML = '';
        const optionPrefixes = ['A', 'B', 'C', 'D'];

        this.questions.forEach((q, idx) => {
          const userAnsIdx = this.userAnswers[idx];
          const isCorrect = userAnsIdx === q.answerIndex;

          const card = document.createElement('div');
          card.className = `p-3 rounded-xl border text-xs leading-relaxed transition-all ${
            isCorrect 
              ? 'bg-slate-50/60 dark:bg-slate-800/40 border-slate-200 dark:border-slate-800' 
              : 'bg-rose-50/50 dark:bg-rose-950/20 border-rose-200 dark:border-rose-900/50'
          }`;

          card.innerHTML = `
            <div class="flex items-start justify-between gap-2 mb-1.5">
              <span class="font-bold text-slate-800 dark:text-slate-200">Q${q.id}. ${q.question}</span>
              <span class="px-2 py-0.5 rounded text-[10px] font-bold flex-none ${
                isCorrect ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/60 dark:text-emerald-300' : 'bg-rose-100 text-rose-700 dark:bg-rose-900/60 dark:text-rose-300'
              }">
                ${isCorrect ? 'Correct' : 'Incorrect'}
              </span>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-2 pt-2 border-t border-slate-200/60 dark:border-slate-800">
              <div class="flex items-center gap-1.5">
                <span class="text-slate-400">Your Answer:</span>
                <span class="font-semibold ${userAnsIdx === q.answerIndex ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}">
                  ${userAnsIdx !== null ? optionPrefixes[userAnsIdx] + ') ' + q.options[userAnsIdx] : 'Unanswered'}
                </span>
              </div>
              <div class="flex items-center gap-1.5">
                <span class="text-slate-400">Correct Key:</span>
                <span class="font-semibold text-emerald-600 dark:text-emerald-400">
                  ${optionPrefixes[q.answerIndex]}) ${q.options[q.answerIndex]}
                </span>
              </div>
            </div>
            
            <div class="mt-2 text-slate-500 dark:text-slate-400 bg-white/60 dark:bg-slate-900/40 p-2 rounded-lg border border-slate-200/50 dark:border-slate-800/50">
              <span class="font-bold text-slate-700 dark:text-slate-300">Explanation:</span> ${q.explanation}
            </div>
          `;

          this.dom.reviewList.appendChild(card);
        });
      }

      restartQuiz() {
        this.currentIndex = 0;
        this.score = 0;
        this.secondsElapsed = 0;
        this.userAnswers.fill(null);

        this.dom.headerScore.textContent = '0';
        this.dom.resultsScreen.classList.add('hidden');
        this.dom.quizScreen.classList.remove('hidden');

        clearInterval(this.timerInterval);
        this.startTimer();
        this.renderQuestion();
      }

      bindEvents() {
        // Theme button click
        this.dom.themeToggle.onclick = () => this.toggleTheme();

        // Keyboard Shortcuts (A-D or 1-4, Enter to advance)
        window.addEventListener('keydown', (e) => {
          if (this.dom.quizScreen.classList.contains('hidden')) return;

          const key = e.key.toUpperCase();
          if (['A', '1'].includes(key)) this.selectOption(0);
          else if (['B', '2'].includes(key)) this.selectOption(1);
          else if (['C', '3'].includes(key)) this.selectOption(2);
          else if (['D', '4'].includes(key)) this.selectOption(3);
          else if ((e.key === 'Enter' || e.key === ' ') && !this.dom.nextBtn.disabled) {
            e.preventDefault();
            this.nextQuestion();
          }
        });
      }
    }

    /* Initialize Application on window load */
    let app;
    window.onload = () => {
      app = new QuizApp();
    };
  </script>
</body>
</html>
