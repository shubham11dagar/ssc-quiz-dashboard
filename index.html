<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSC Exam Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .folder-card, .quiz-card { transition: all 0.2s ease-in-out; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

  <!-- Header -->
  <header class="border-b border-slate-200 dark:border-slate-800/80 bg-white/70 dark:bg-slate-900/50 backdrop-blur-md sticky top-0 z-50 transition-colors duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
      
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-9 h-9 shrink-0 rounded-xl bg-indigo-600/10 dark:bg-indigo-600/20 text-indigo-600 dark:text-indigo-400 flex items-center justify-center font-bold text-lg border border-indigo-500/20 dark:border-indigo-500/30">
          📂
        </div>
        <div class="truncate">
          <h1 class="text-base font-semibold text-slate-900 dark:text-white tracking-wide truncate">SSC Quiz Explorer</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 truncate">Dynamic Hierarchy Explorer</p>
        </div>
      </div>

      <!-- Controls Right: Search + Theme Toggle -->
      <div class="flex items-center gap-3">
        <!-- Quick Search Bar -->
        <div class="relative w-36 sm:w-64">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search quiz..." 
            oninput="handleSearch()" 
            class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-800 dark:text-slate-200 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
          />
        </div>

        <!-- Day/Night Theme Toggle Button -->
        <button 
          id="themeToggleBtn"
          onclick="toggleTheme()" 
          title="Toggle Day/Night Theme"
          class="p-2 rounded-xl border border-slate-300 dark:border-slate-800 bg-slate-100 dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800 transition-all flex items-center justify-center shrink-0"
        >
          <span id="themeIcon" class="text-sm">🌙</span>
        </button>
      </div>

    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
    
    <!-- Breadcrumb Navigation Bar -->
    <nav id="breadcrumbBar" class="flex items-center flex-wrap gap-2 mb-8 bg-white dark:bg-slate-900/60 p-3 rounded-xl border border-slate-200 dark:border-slate-800/80 text-xs shadow-sm dark:shadow-none transition-colors">
      <!-- Injected via JavaScript -->
    </nav>

    <!-- Folder Navigation Section -->
    <section id="folderSection" class="mb-10">
      <h2 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-4">Folders</h2>
      <div id="folderGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
        <!-- Injected via JavaScript -->
      </div>
    </section>

    <!-- Quiz Files Section -->
    <section id="fileSection">
      <h2 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-4">Quiz Websites</h2>
      <div id="fileGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Injected via JavaScript -->
      </div>
    </section>

  </main>

  <!-- Embedded Modal View -->
  <div id="quizModal" class="fixed inset-0 bg-slate-900/60 dark:bg-slate-950/90 backdrop-blur-md z-50 hidden flex flex-col">
    <div class="p-4 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between shadow-sm">
      <h3 id="modalTitle" class="text-sm font-semibold text-slate-900 dark:text-white truncate">Quiz Title</h3>
      <button onclick="closeQuizModal()" class="px-3 py-1 bg-red-500/10 hover:bg-red-500/20 text-red-600 dark:text-red-400 text-xs rounded-lg border border-red-500/20 transition-colors">
        ✕ Close Quiz
      </button>
    </div>
    <iframe id="quizIframe" class="w-full flex-1 border-0" src=""></iframe>
  </div>

  <footer class="border-t border-slate-200 dark:border-slate-800/60 py-4 text-center text-xs text-slate-500 dark:text-slate-500 transition-colors">
    SSC Exam Explorer • Hierarchical Folder System
  </footer>

  <script>
    // AUTO-GENERATED-START
    const fileTree = [
  {
    "title": "Set 1",
    "path": "English/01-Set 1.html",
    "folders": [
      "English"
    ]
  },
  {
    "title": "Set 2",
    "path": "English/02-Set 2.html",
    "folders": [
      "English"
    ]
  },
  {
    "title": "Set 1",
    "path": "English/Phrasel Verbs/01-set 1.html",
    "folders": [
      "English",
      "Phrasel Verbs"
    ]
  },
  {
    "title": "Set 2",
    "path": "English/Phrasel Verbs/02-Set 2.html",
    "folders": [
      "English",
      "Phrasel Verbs"
    ]
  },
  {
    "title": "Set 3",
    "path": "English/Phrasel Verbs/03-Set 3.html",
    "folders": [
      "English",
      "Phrasel Verbs"
    ]
  },
  {
    "title": "Set 1",
    "path": "English/Root Words/01-Set 1.html",
    "folders": [
      "English",
      "Root Words"
    ]
  },
  {
    "title": "Space History And Orbits",
    "path": "Current Affairs/Space/01-Space history and orbits.html",
    "folders": [
      "Current Affairs",
      "Space"
    ]
  },
  {
    "title": "Launch Vehicles & Satellites",
    "path": "Current Affairs/Space/02-Launch Vehicles & Satellites.html",
    "folders": [
      "Current Affairs",
      "Space"
    ]
  },
  {
    "title": "Isro Missions Part 1",
    "path": "Current Affairs/Space/03-ISRO Missions part 1.html",
    "folders": [
      "Current Affairs",
      "Space"
    ]
  },
  {
    "title": "Isro Missions Part 2",
    "path": "Current Affairs/Space/04-ISRO Missions Part 2.html",
    "folders": [
      "Current Affairs",
      "Space"
    ]
  },
  {
    "title": "Make In India & International Missions",
    "path": "Current Affairs/Space/05-Make in India & International Missions.html",
    "folders": [
      "Current Affairs",
      "Space"
    ]
  },
  {
    "title": "Firsts In Sapce",
    "path": "Current Affairs/Space/06-Firsts in Sapce.html",
    "folders": [
      "Current Affairs",
      "Space"
    ]
  },
  {
    "title": "Central Sector Scheme",
    "path": "Current Affairs/Schemes/01-Central Sector Scheme.html",
    "folders": [
      "Current Affairs",
      "Schemes"
    ]
  },
  {
    "title": "Bharat Ratna And Padma Awards",
    "path": "Current Affairs/Awards & Honours/01-Bharat Ratna and Padma awards.html",
    "folders": [
      "Current Affairs",
      "Awards & Honours"
    ]
  },
  {
    "title": "Sports Awards",
    "path": "Current Affairs/Awards & Honours/02-Sports Awards.html",
    "folders": [
      "Current Affairs",
      "Awards & Honours"
    ]
  },
  {
    "title": "Literature And Film Awards",
    "path": "Current Affairs/Awards & Honours/03-Literature and Film Awards.html",
    "folders": [
      "Current Affairs",
      "Awards & Honours"
    ]
  },
  {
    "title": "Set 1",
    "path": "Current Affairs/Reports & Rankings/01-Set 1.html",
    "folders": [
      "Current Affairs",
      "Reports & Rankings"
    ]
  },
  {
    "title": "Set 2",
    "path": "Current Affairs/Reports & Rankings/02-Set 2.html",
    "folders": [
      "Current Affairs",
      "Reports & Rankings"
    ]
  },
  {
    "title": "International Conventions",
    "path": "Environment/01-International Conventions.html",
    "folders": [
      "Environment"
    ]
  },
  {
    "title": "Dams & Waterfalls",
    "path": "Geography/01-Dams & Waterfalls.html",
    "folders": [
      "Geography"
    ]
  },
  {
    "title": "National Parks Part 1",
    "path": "Geography/02-National Parks part 1.html",
    "folders": [
      "Geography"
    ]
  },
  {
    "title": "Fraction To Decimal",
    "path": "Calculation/01-fraction to decimal.html",
    "folders": [
      "Calculation"
    ]
  }
];
    // AUTO-GENERATED-END

    // Theme Toggle Functionality
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
        document.getElementById('themeIcon').innerText = '☀️';
      } else {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').innerText = '🌙';
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      if (isDark) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        document.getElementById('themeIcon').innerText = '☀️';
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        document.getElementById('themeIcon').innerText = '🌙';
      }
    }

    // Current folder state array
    let currentPath = [];

    function initExplorer() {
      initTheme();
      renderExplorer();
    }

    function navigateToFolder(pathArray) {
      currentPath = pathArray;
      document.getElementById('searchInput').value = '';
      renderExplorer();
    }

    function renderBreadcrumbs() {
      const bar = document.getElementById('breadcrumbBar');
      bar.innerHTML = '';

      // Root Home Button
      const homeBtn = document.createElement('button');
      homeBtn.onclick = () => navigateToFolder([]);
      homeBtn.className = `px-2.5 py-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors ${currentPath.length === 0 ? 'text-indigo-600 dark:text-indigo-400 font-semibold' : 'text-slate-500 dark:text-slate-400'}`;
      homeBtn.innerHTML = `🏠 Root`;
      bar.appendChild(homeBtn);

      // Build intermediate breadcrumb steps
      let pathAccumulator = [];
      currentPath.forEach((folderName, index) => {
        pathAccumulator.push(folderName);
        const targetPath = [...pathAccumulator];
        
        const separator = document.createElement('span');
        separator.className = 'text-slate-400 dark:text-slate-600';
        separator.innerText = '/';
        bar.appendChild(separator);

        const folderBtn = document.createElement('button');
        folderBtn.onclick = () => navigateToFolder(targetPath);
        const isLast = index === currentPath.length - 1;
        folderBtn.className = `px-2 py-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors ${isLast ? 'text-indigo-600 dark:text-indigo-400 font-semibold bg-indigo-50 dark:bg-indigo-500/10' : 'text-slate-500 dark:text-slate-400'}`;
        folderBtn.innerText = folderName;
        bar.appendChild(folderBtn);
      });
    }

    function renderExplorer() {
      renderBreadcrumbs();

      const folderGrid = document.getElementById('folderGrid');
      const fileGrid = document.getElementById('fileGrid');
      const folderSection = document.getElementById('folderSection');
      const fileSection = document.getElementById('fileSection');

      folderGrid.innerHTML = '';
      fileGrid.innerHTML = '';

      const currentDepth = currentPath.length;

      // Filter files matching current folder depth
      const matchingFiles = fileTree.filter(item => {
        if (item.folders.length < currentDepth) return false;
        for (let i = 0; i < currentDepth; i++) {
          if (item.folders[i] !== currentPath[i]) return false;
        }
        return true;
      });

      // Find subfolders at current level
      const subfolderSet = new Set();
      const filesAtThisLevel = [];

      matchingFiles.forEach(item => {
        if (item.folders.length > currentDepth) {
          subfolderSet.add(item.folders[currentDepth]);
        } else if (item.folders.length === currentDepth) {
          filesAtThisLevel.push(item);
        }
      });

      // Render Subfolders
      const subfolders = Array.from(subfolderSet);
      if (subfolders.length === 0) {
        folderSection.classList.add('hidden');
      } else {
        folderSection.classList.remove('hidden');
        subfolders.forEach(subfolder => {
          const card = document.createElement('div');
          card.onclick = () => navigateToFolder([...currentPath, subfolder]);
          card.className = "folder-card bg-white dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 rounded-xl p-4 flex items-center gap-3 cursor-pointer hover:border-indigo-500/50 dark:hover:border-indigo-500/50 hover:shadow-md dark:hover:shadow-lg transition-all";
          card.innerHTML = `
            <div class="text-2xl">📁</div>
            <div class="truncate">
              <h3 class="text-xs font-semibold text-slate-800 dark:text-white truncate">${subfolder}</h3>
              <p class="text-[10px] text-slate-400 dark:text-slate-500">Folder</p>
            </div>
          `;
          folderGrid.appendChild(card);
        });
      }

      // Render Files
      if (filesAtThisLevel.length === 0) {
        if (subfolders.length === 0) {
          fileGrid.innerHTML = `
            <div class="col-span-full py-12 text-center text-slate-400 dark:text-slate-500 text-sm">
              This folder is empty.
            </div>
          `;
        } else {
          fileSection.classList.add('hidden');
        }
      } else {
        fileSection.classList.remove('hidden');
        filesAtThisLevel.forEach(file => {
          const card = document.createElement('div');
          card.className = "quiz-card bg-white dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800/80 rounded-xl p-5 flex flex-col justify-between hover:border-slate-300 dark:hover:border-slate-700 shadow-sm dark:shadow-none hover:shadow-md transition-all";
          card.innerHTML = `
            <div>
              <div class="flex items-center gap-2 mb-2">
                <span class="text-lg">📄</span>
                <span class="text-[10px] text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-500/10 px-2 py-0.5 rounded border border-indigo-200 dark:border-indigo-500/20 font-mono">Quiz Page</span>
              </div>
              <h3 class="text-sm font-semibold text-slate-800 dark:text-white mb-2">${file.title}</h3>
              <p class="text-[11px] text-slate-400 dark:text-slate-500 font-mono truncate mb-4" title="${file.path}">${file.path}</p>
            </div>
            
            <div class="grid grid-cols-2 gap-2">
              <button onclick="openQuizModal('${file.path}', '${file.title}')" 
                 class="inline-flex items-center justify-center bg-indigo-50 dark:bg-indigo-600/20 hover:bg-indigo-600 text-indigo-600 dark:text-indigo-300 hover:text-white text-xs font-medium py-2 rounded-lg transition-colors border border-indigo-200 dark:border-indigo-500/30">
                Modal View
              </button>
              <a href="${file.path}" target="_self" 
                 class="inline-flex items-center justify-center bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-medium py-2 rounded-lg transition-colors border border-slate-200 dark:border-slate-700">
                Direct Link
              </a>
            </div>
          `;
          fileGrid.appendChild(card);
        });
      }
    }

    // Search Mode override
    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!query) {
        renderExplorer();
        return;
      }

      document.getElementById('folderSection').classList.add('hidden');
      document.getElementById('fileSection').classList.remove('hidden');

      const fileGrid = document.getElementById('fileGrid');
      fileGrid.innerHTML = '';

      const searchResults = fileTree.filter(f => 
        f.title.toLowerCase().includes(query) || 
        f.path.toLowerCase().includes(query)
      );

      if (searchResults.length === 0) {
        fileGrid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 dark:text-slate-500 text-sm">No quizzes found matching "${query}".</div>`;
        return;
      }

      searchResults.forEach(file => {
        const card = document.createElement('div');
        card.className = "quiz-card bg-white dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800/80 rounded-xl p-5 flex flex-col justify-between hover:border-slate-300 dark:hover:border-slate-700 shadow-sm dark:shadow-none transition-all";
        card.innerHTML = `
          <div>
            <div class="flex items-center gap-2 mb-2">
              <span class="text-lg">🔍</span>
              <span class="text-[10px] text-slate-500 dark:text-slate-400 font-mono">${file.folders.join(' / ')}</span>
            </div>
            <h3 class="text-sm font-semibold text-slate-800 dark:text-white mb-2">${file.title}</h3>
            <p class="text-[11px] text-slate-400 dark:text-slate-500 font-mono truncate mb-4">${file.path}</p>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="openQuizModal('${file.path}', '${file.title}')" class="bg-indigo-50 dark:bg-indigo-600/20 hover:bg-indigo-600 text-indigo-600 dark:text-indigo-300 hover:text-white text-xs font-medium py-2 rounded-lg border border-indigo-200 dark:border-indigo-500/30 transition-colors">Modal View</button>
            <a href="${file.path}" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-medium py-2 rounded-lg text-center border border-slate-200 dark:border-slate-700 transition-colors">Direct Link</a>
          </div>
        `;
        fileGrid.appendChild(card);
      });
    }

    function openQuizModal(path, title) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('quizIframe').src = path;
      document.getElementById('quizModal').classList.remove('hidden');
    }

    function closeQuizModal() {
      document.getElementById('quizIframe').src = '';
      document.getElementById('quizModal').classList.add('hidden');
    }

    initExplorer();
  </script>
</body>
</html>
